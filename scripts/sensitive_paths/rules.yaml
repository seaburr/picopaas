# Inputs for deploy/error-pages/sensitive-paths.yaml. After changing this file run: python scripts/sensitive_paths/build.py --write
# Upstream: dotfile entries of OWASP CRS rules/restricted-files.data (see NOTICE). Its other entries are not used:
# config.json, config.php, /package.json and the like are real paths of real apps.
crsVersion: v4.30.0
# CRS entries left out because the name is too generic to be sure no app uses it as a route or asset folder.
skip:
  - .cache/
  - .cache/notify-osd.log
  - .config/
  - .settings/
  - .tools/
# Our own additions, as regex fragments that match one or more whole path segments, case-insensitively.
extra:
  - '\.env[^/]*'
  - '\.bash_history'
  - 'wp-config\.php[^/]*'
  - 'id_(rsa|dsa|ecdsa|ed25519)'
  - 'privkey\.pem'
  - 'private\.(key|pem)'
  - 'server\.key'
  - '[^/]*\.(ppk|tfstate|tfvars)(\.[^/]*)?'
  # Round 2 (2026-11-07), from scanner probes seen on a static site. Each fragment is whole segments; "a/b" is two segments.
  # Editor, CI and hosting dot-dirs CRS lacks (.github also covers /.github/workflows/x.yml):
  - '\.(github|cursor|amplifyrc|ebextensions|elasticbeanstalk)'
  # Credentials and config with secrets:
  - '(gcp-)?credentials\.(json|ini)'
  - 'service-account[^/]*\.json'
  - 'secrets\.(json|ya?ml)'
  - '[^/]+\.env'
  - 'env\.txt'
  - 'appsettings[^/]*\.json'
  # Infrastructure as code and container build files:
  - '[^/]*\.tf'
  - 'samconfig\.(toml|ya?ml)'
  - 'cdk\.out'
  - 'amplify/team-provider-info\.json'
  - 'Dockerfile'
  - 'docker-compose[^/]*\.ya?ml'
  # Logs, dumps and debug endpoints:
  - 'laravel\.log'
  - 'wp-content/debug\.log'
  - '[^/]*\.sql(\.(gz|zip|bz2))?'
  - 'phpinfo\.php'
  - '_profiler'
  - 'actuator/(env|heapdump)'
  # AI proxy configs:
  - 'litellm[^/]*\.ya?ml'
  - 'litellm'
  - 'openai-proxy[^/]*'
