apiVersion: picopaas/v1
name: forgejo
# Public image, pinned. The -rootless variant runs as USER 1000:1000 on port 3000 and reads its config
# from env vars, so PicoPaaS runs it unmodified (no Dockerfile here). Verified live 2026-11-01 (SQLite)
# and 2026-11-03 (platform MySQL, CA-verified; see README).
image: codeberg.org/forgejo/forgejo:17.0.1-rootless
port: 3000
allowSensitivePaths: true   # shows repository files such as .env, which the platform otherwise answers 404 for
healthCheck:
  enabled: true
  path: /api/healthz
resources:
  db: true
  db_engine: mysql
  # Repositories, app.ini and the generated internal token live here (the database is the platform MySQL).
  # Mount the image's whole work dir. Needs volumes enabled on the platform.
  volume: { sizeGi: 1, mountPath: /var/lib/gitea }
env:
  # First-boot settings (written into app.ini on the volume the first time only).
  ROOT_URL: "${{ app.url }}"
  HTTP_PORT: "3000"
  DISABLE_SSH: "true"        # only HTTPS reaches the app; git over SSH is not available
  DB_TYPE: mysql             # SQLite fallback: drop the db block and the DB_*/SSL_*/MAX_* lines, use DB_TYPE: sqlite3
  DB_HOST: "${{ db.host }}:${{ db.port }}"
  DB_NAME: "${{ db.name }}"
  DB_USER: "${{ db.user }}"
  DB_PASSWD: "${{ db.password }}"
  # CA-verified TLS: SSL_MODE "true" makes Go verify against its root store. SSL_CERT_FILE adds the platform CA
  # (Go still reads /etc/ssl/certs, so outbound HTTPS such as repo migration keeps working).
  FORGEJO__DATABASE__SSL_MODE: "true"
  SSL_CERT_FILE: "${{ db.ca_file }}"
  # Stay under the per-app MySQL MAX_USER_CONNECTIONS (10).
  FORGEJO__DATABASE__MAX_OPEN_CONNS: "3"
  FORGEJO__DATABASE__MAX_IDLE_CONNS: "2"
  # Applied on every boot (FORGEJO__SECTION__KEY; Forgejo lowercases the section name).
  FORGEJO__SERVER__START_SSH_SERVER: "false"
  FORGEJO__SERVER__OFFLINE_MODE: "true"
  FORGEJO__MAILER__ENABLED: "false"
  FORGEJO__CRON_UPDATE_CHECKER__ENABLED: "false"
  FORGEJO__ACTIONS__ENABLED: "false"
  # Leave this at "false" until you have registered your own account (the first account becomes the admin),
  # then set it to "true" and save.
  FORGEJO__SERVICE__DISABLE_REGISTRATION: "false"
secrets:
  # Any long random string (openssl rand -hex 32). Setting it also skips the install wizard.
  - SECRET_KEY
