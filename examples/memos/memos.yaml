apiVersion: picopaas/v1
name: memos
# examples/memos/Dockerfile: the official image with USER 10001 (built by examples.yml).
image: ghcr.io/seaburr/picopaas-example-memos:latest
port: 5230
healthCheck:
  enabled: true
  path: /healthz
resources:
  db: true
  db_engine: pg
env:
  MEMOS_PORT: "5230"
  MEMOS_DRIVER: "postgres"
  # Built from parts: CA-verified TLS against the platform CA mounted at /etc/picopaas/db-ca.pem.
  MEMOS_DSN: "postgres://${{ db.user }}:${{ db.password }}@${{ db.host }}:${{ db.port }}/${{ db.name }}?sslmode=verify-full&sslrootcert=${{ db.ca_file }}"
  MEMOS_INSTANCE_URL: "${{ app.url }}"
