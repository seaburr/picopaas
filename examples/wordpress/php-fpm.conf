; Replaces the image's php-fpm.conf and php-fpm.d/*. Runs as the container user (10001); no user/group lines.
[global]
daemonize = no
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
log_level = warning
emergency_restart_threshold = 5
emergency_restart_interval = 1m

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0666
; Sized for 384 MB RAM: a WordPress worker is ~40-60 MB, nginx ~10 MB, opcache 64 MB, plus the wp-cron CLI.
; ondemand keeps idle memory near zero; 4 workers also keeps DB connections (cap 10 per app) well under the limit.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 400
ping.path = /ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
request_terminate_timeout = 110s
; Defense in depth for the October 2026 PHP RCE fixes (CVE-2026-109618/-109619). These are admin-level and cannot be
; changed by the application; the real fix is PHP >= 8.5.12 / 8.4.27.
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /tmp
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
