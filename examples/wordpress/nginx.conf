# Runs as UID 10001. Writes only to /tmp. Listens on 8080.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    server_tokens off;
    client_max_body_size 32m;          # keep in step with php.ini post_max_size
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # TLS ends at Traefik; trust its X-Forwarded-* only from private ranges.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Brute-force guard for the login form: 10 requests/min per client IP (real IP from X-Forwarded-For, above).
    limit_req_zone $binary_remote_addr zone=wplogin:1m rate=10r/m;
    limit_req_status 429;

    map $http_x_forwarded_proto $fwd_https { default off; https on; }

    # Optional page cache (WP_PAGE_CACHE=true). Never cache logged-in users, POSTs, admin or query strings.
    fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=wp:5m max_size=40m inactive=30m use_temp_path=off;
    map $request_method $skip_m { default 1; GET 0; HEAD 0; }
    map $query_string $skip_q { default 1; "" 0; }
    map $http_cookie $skip_c { default 0; ~*(wordpress_logged_in|wp-postpass|comment_author) 1; }
    map $request_uri $skip_u { default 0; ~*^/(wp-admin|wp-login|wp-json|wp-cron|xmlrpc|wp-comments-post) 1; }

    server {
        listen 8080 default_server;
        server_name _;
        include /tmp/nginx-root.conf;      # root <WP_ROOT>;
        index index.php;

        # Optional include files written by the entrypoint from env vars.
        include /tmp/nginx-xmlrpc.conf;
        include /tmp/nginx-cache.conf;
        include /tmp/nginx-state.conf;     # sets $wp_not_ready / $wp_not_ready_msg while WP is not installed or configured

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Health checks. /healthz = nginx + php-fpm up (no DB, no WP load). /healthz-static = nginx only.
        location = /healthz-static { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /healthz {
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /ping;
            fastcgi_param SCRIPT_NAME /ping;
            fastcgi_pass unix:/tmp/php-fpm.sock;
        }

        # Permalinks (same as the old .htaccess WordPress block; the old site used plain ?p= links, this also covers pretty ones).
        location / {
            if ($wp_not_ready) { return 503 "$wp_not_ready_msg\n"; }
            try_files $uri $uri/ /index.php?$args;
        }

        # The web installer is never reachable: installation happens in the entrypoint (WP-CLI).
        location ~* ^/wp-admin/(install|setup-config)\.php$ { return 403; }

        # Never serve these.
        location ~ /\.(?!well-known) { deny all; }
        location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)$ { deny all; }
        location ~* ^/wp-content/(uploads|upgrade|upgrade-temp-backup|jetpack-waf)/.*\.(php\d?|phtml|phar|pl|py|cgi|sh)$ { deny all; }
        location ~* ^/wp-content/.*\.(log|sql|bak|zip|tar|gz)$ { deny all; }
        location ~* ^/wp-includes/.*\.php$ { deny all; }   # core internals are never requested directly

        location = /wp-login.php {
            limit_req zone=wplogin burst=5 nodelay;
            if ($wp_not_ready) { return 503 "$wp_not_ready_msg\n"; }
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/wp-login.php;
            fastcgi_param SCRIPT_NAME /wp-login.php;
            fastcgi_param HTTPS $fwd_https;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php$ {
            if ($wp_not_ready) { return 503 "$wp_not_ready_msg\n"; }
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $fwd_https;
            fastcgi_param HTTP_PROXY "";                # httpoxy
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_cache_bypass $skip_m $skip_q $skip_c $skip_u $wp_cache_off;
            fastcgi_no_cache $skip_m $skip_q $skip_c $skip_u $wp_cache_off;
            fastcgi_cache wp;
            fastcgi_cache_key "$scheme$request_method$host$request_uri";
            fastcgi_cache_valid 200 301 302 60s;
            fastcgi_cache_use_stale error timeout updating http_500 http_503;
            fastcgi_cache_lock on;
            add_header X-Cache $upstream_cache_status;
        }

        # Static assets: long cache; WordPress adds ?ver= to its own assets.
        location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options nosniff always;
            access_log off;
            try_files $uri =404;
        }
    }
}
