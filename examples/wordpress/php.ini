; Drop-in at /usr/local/etc/php/conf.d/zz-picopaas.ini
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 128M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 24M
max_file_uploads = 20
max_input_vars = 3000
file_uploads = On
allow_url_include = Off
session.upload_progress.enabled = 0
session.save_path = /tmp
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
zend.exception_ignore_args = On
; PHP 8.5: do not put argument values in fatal error backtraces.
fatal_error_backtraces = Off
realpath_cache_size = 2M
realpath_cache_ttl = 300
; OPcache (shared memory counts against the 384 MB limit). Code lives on a writable volume that the dashboard can
; change, so revalidate periodically instead of validate_timestamps=0.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = disable
opcache.file_cache = /tmp/opcache
