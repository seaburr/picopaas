# Assigns Garage's one-node layout (zone dc1, 2G) and imports the platform's S3 key through the admin API (v2).
# Idempotent; local-up.sh deletes and re-creates the Job on every run (Jobs are immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-setup
  namespace: picopaas-data
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: curlimages/curl:8.11.1
          envFrom:
            - secretRef:
                name: garage-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              A=http://garage.picopaas-data.svc:3903
              H="Authorization: Bearer $GARAGE_ADMIN_TOKEN"
              until curl -fsS -H "$H" "$A/v2/GetClusterHealth" >/dev/null; do sleep 2; done
              STATUS=$(curl -fsS -H "$H" "$A/v2/GetClusterStatus" | tr -d ' \n')
              NODE=$(printf '%s' "$STATUS" | sed -n 's/.*"nodes":\[{"id":"\([0-9a-f]*\)".*/\1/p')
              [ -n "$NODE" ] || { echo "no node id in: $STATUS"; exit 1; }
              if printf '%s' "$STATUS" | grep -q '"role":null'; then
                curl -fsS -H "$H" -X POST "$A/v2/UpdateClusterLayout" \
                  -d "{\"roles\":[{\"id\":\"$NODE\",\"zone\":\"dc1\",\"capacity\":2147483648,\"tags\":[]}]}" >/dev/null
                V=$(curl -fsS -H "$H" "$A/v2/GetClusterLayout" | tr -d ' \n' | sed -n 's/.*"version":\([0-9]*\).*/\1/p' | head -1)
                curl -fsS -H "$H" -X POST "$A/v2/ApplyClusterLayout" -d "{\"version\":$((V + 1))}" >/dev/null
                echo "layout applied"
              else
                echo "layout already applied"
              fi
              if ! curl -fsS -H "$H" "$A/v2/GetKeyInfo?id=$PLATFORM_KEY_ID" >/dev/null 2>&1; then
                curl -fsS -H "$H" -X POST "$A/v2/ImportKey" \
                  -d "{\"name\":\"pp-platform\",\"accessKeyId\":\"$PLATFORM_KEY_ID\",\"secretAccessKey\":\"$PLATFORM_KEY_SECRET\"}" >/dev/null
                echo "platform key imported"
              fi
              curl -fsS -H "$H" -X POST "$A/v2/UpdateKey?id=$PLATFORM_KEY_ID" -d '{"allow":{"createBucket":true}}' >/dev/null
              # Backup bucket + a key that can only read/write that one bucket (so BACKUP_KEY_SCOPED=1 is true).
              if ! curl -fsS -H "$H" "$A/v2/GetKeyInfo?id=$BACKUP_KEY_ID" >/dev/null 2>&1; then
                curl -fsS -H "$H" -X POST "$A/v2/ImportKey" \
                  -d "{\"name\":\"pp-backup\",\"accessKeyId\":\"$BACKUP_KEY_ID\",\"secretAccessKey\":\"$BACKUP_KEY_SECRET\"}" >/dev/null
                echo "backup key imported"
              fi
              if ! curl -fsS -H "$H" "$A/v2/GetBucketInfo?globalAlias=$BACKUP_BUCKET" >/dev/null 2>&1; then
                curl -fsS -H "$H" -X POST "$A/v2/CreateBucket" -d "{\"globalAlias\":\"$BACKUP_BUCKET\"}" >/dev/null
                echo "backup bucket created"
              fi
              BID=$(curl -fsS -H "$H" "$A/v2/GetBucketInfo?globalAlias=$BACKUP_BUCKET" | tr -d ' \n' | sed -n 's/^{"id":"\([0-9a-f]*\)".*/\1/p')
              [ -n "$BID" ] || { echo "no bucket id"; exit 1; }
              curl -fsS -H "$H" -X POST "$A/v2/AllowBucketKey" \
                -d "{\"bucketId\":\"$BID\",\"accessKeyId\":\"$BACKUP_KEY_ID\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}" >/dev/null
              echo "garage setup done"
