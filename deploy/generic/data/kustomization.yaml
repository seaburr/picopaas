# Data tier for the generic target. Build with load restrictions off (it reuses ../../mysql/statefulset.yaml):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/generic/data | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../mysql/statefulset.yaml
  - postgres.yaml
  - garage.yaml
patches:
  - path: mysql.patch.yaml
  # TLS for MySQL via the conf.d ConfigMap the base already mounts.
  - target:
      kind: ConfigMap
      name: mysql-config
    patch: |-
      - op: add
        path: /data/tls.cnf
        value: |
          [mysqld]
          ssl_ca=/etc/mysql-tls/ca.crt
          ssl_cert=/etc/mysql-tls/tls.crt
          ssl_key=/etc/mysql-tls/tls.key
          require_secure_transport=ON
          tls_version=TLSv1.2,TLSv1.3
  # Small box: trim MySQL (prod 768Mi) for a laptop.
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 640Mi
