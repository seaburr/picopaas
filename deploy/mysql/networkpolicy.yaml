# Default deny ingress for the data namespace, then allow 3306 to mysql from:
#  - app namespaces (label picopaas.io/app-id, set by app/k8s_manifests.py::namespace_manifest;
#    tenants cannot edit namespace labels)
#  - picopaas-system (the platform: provisions per-app DBs)
#  - pods in picopaas-data itself (the backup CronJob)
# NetworkPolicy cannot tell platform from tenant at the MySQL layer, so account security is MySQL-side:
# root is localhost-only; picopaas_admin has a long random password (issue #1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: picopaas-data
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-clients
  namespace: picopaas-data
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: picopaas.io/app-id
                operator: Exists
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: picopaas-system
        - podSelector:
            matchLabels:
              app: mysql-backup
      ports:
        - protocol: TCP
          port: 3306
