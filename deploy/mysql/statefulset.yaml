# In-cluster MySQL (use_managed_mysql = false). Private: ClusterIP only, NetworkPolicy-restricted.
# Hand-made Secret `mysql-root` (see README) holds MYSQL_ROOT_PASSWORD, MYSQL_ADMIN_PASSWORD,
# MYSQL_BACKUP_PASSWORD. root is localhost-only; the platform uses `picopaas_admin`, backups use `picopaas_backup`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: picopaas-data
data:
  picopaas.cnf: |
    [mysqld]
    # ~25 app DBs x 5 connections each, oversubscribed (ARCHITECTURE.md section 3).
    max_connections=150
    # Small box: leave room for the 768Mi limit.
    innodb_buffer_pool_size=192M
    performance_schema=OFF
    skip-name-resolve
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
---
# Runs once, on first initialization of an empty data dir (official image entrypoint). Existing
# installs: apply the same SQL by hand (see deploy/README.md "Hardening an existing MySQL").
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: picopaas-data
data:
  10-users.sh: |
    #!/bin/bash
    set -eu
    # Passwords come from env (Secret mysql-root); they are generated hex/alnum, no quoting issues.
    mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    -- Platform admin (MySQLAdminClient). Host '%' because platform pod IPs are ephemeral and a
    -- pod-CIDR host match would also cover tenant pods (same cluster CIDR), so it gives no real
    -- isolation. Protection = NetworkPolicy + a >=32 char random password (README: generate with
    -- openssl rand -hex 24 or longer). Tenants cannot log in without the password.
    CREATE USER IF NOT EXISTS 'picopaas_admin'@'%' IDENTIFIED BY '${MYSQL_ADMIN_PASSWORD}';
    -- CREATE USER (global): CREATE USER / ALTER USER / DROP USER for app_<id> users. Cannot be scoped.
    GRANT CREATE USER ON *.* TO 'picopaas_admin'@'%';
    -- RELOAD (global): FLUSH PRIVILEGES, which MySQLAdminClient runs after each change. (Redundant after
    -- GRANT/CREATE USER in MySQL 8; drop this line if the client stops calling FLUSH.)
    GRANT RELOAD ON *.* TO 'picopaas_admin'@'%';
    -- Per-app databases only (pattern 'app\_%', underscore escaped): CREATE/DROP DATABASE, plus ALL so that
    -- the client can run GRANT ALL ON app_<id>.* to the tenant user and REVOKE/GRANT the write privileges
    -- for read-only quota enforcement. MySQL only lets you grant privileges you hold, with GRANT OPTION,
    -- so ALL ... WITH GRANT OPTION on this pattern is the tightest set that works. It also lets the
    -- information_schema.TABLES size query see those schemas. It has NO access to mysql.*, other schemas,
    -- or global admin privileges.
    GRANT ALL ON \`app\\_%\`.* TO 'picopaas_admin'@'%' WITH GRANT OPTION;

    -- Backup: read-only, exactly what mysqldump --all-databases --single-transaction --routines --events --triggers needs.
    CREATE USER IF NOT EXISTS 'picopaas_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
    -- SELECT (read data), SHOW VIEW (views), TRIGGER (--triggers), LOCK TABLES (mysqldump default lock),
    -- EVENT (--events), PROCESS (tablespace/consistent snapshot metadata queries).
    GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT, PROCESS ON *.* TO 'picopaas_backup'@'%';
    FLUSH PRIVILEGES;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: picopaas-data
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: picopaas-data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The official mysql image ships a `mysql` user with uid/gid 999 and its entrypoint skips the
        # root-only chown/gosu path when started as non-root. fsGroup makes the PVC writable by it.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_ROOT_PASSWORD
            # MYSQL_ROOT_HOST deliberately NOT set: the official image then creates only root@localhost,
            # so root cannot log in over the network from any pod (issue #1). Do not set it to "%".
            - name: MYSQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_ADMIN_PASSWORD
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_BACKUP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              # subPath avoids ext4's lost+found at the volume root breaking `--initialize`.
              subPath: data
            - name: config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mysql-config
        - name: initdb
          configMap:
            name: mysql-initdb
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 10Gi
