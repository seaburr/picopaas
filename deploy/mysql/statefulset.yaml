# In-cluster MySQL (use_managed_mysql = false). Private: ClusterIP only, NetworkPolicy-restricted.
# Hand-made Secret `mysql-root` (see README) holds MYSQL_ROOT_PASSWORD, MYSQL_ADMIN_PASSWORD,
# MYSQL_BACKUP_PASSWORD. root is localhost-only; the platform uses `picopaas_admin`, backups use `picopaas_backup`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: picopaas-data
data:
  picopaas.cnf: |
    [mysqld]
    # ~25 app DBs x 5 connections each, oversubscribed (ARCHITECTURE.md section 3).
    max_connections=150
    # Small box: leave room for the 768Mi limit.
    innodb_buffer_pool_size=192M
    performance_schema=OFF
    skip-name-resolve
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
---
# Runs once, on first initialization of an empty data dir (official image entrypoint). Existing
# installs: apply the same SQL by hand (see deploy/README.md "Hardening an existing MySQL").
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: picopaas-data
data:
  10-users.sh: |
    #!/bin/bash
    set -eu
    # Passwords come from env (Secret mysql-root); they are generated hex/alnum, no quoting issues.
    mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    -- Platform admin (MySQLAdminClient). Host '%' because platform pod IPs are ephemeral and a
    -- pod-CIDR host match would also cover tenant pods (same cluster CIDR), so it gives no real
    -- isolation. Protection = NetworkPolicy + a >=32 char random password (README: generate with
    -- openssl rand -hex 24 or longer). Tenants cannot log in without the password.
    CREATE USER IF NOT EXISTS 'picopaas_admin'@'%' IDENTIFIED BY '${MYSQL_ADMIN_PASSWORD}';
    -- picopaas_admin holds NO direct privileges. MySQL cannot delegate a wildcard-schema grant: with
    -- GRANT ALL ON `app\_%`.* ... WITH GRANT OPTION, `GRANT ... ON app_N.*` still fails with 1044 (the
    -- grantor check does not consult wildcard db grants; verified on 8.4). So all account/schema work
    -- goes through root-owned SQL SECURITY DEFINER procedures in picopaas_ops (see block below).

    -- Backup: read-only, exactly what mysqldump --all-databases --single-transaction --routines --events --triggers needs.
    CREATE USER IF NOT EXISTS 'picopaas_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
    -- SELECT (read data), SHOW VIEW (views), TRIGGER (--triggers), LOCK TABLES (mysqldump default lock),
    -- EVENT (--events), PROCESS (tablespace/consistent snapshot metadata queries).
    GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT, PROCESS ON *.* TO 'picopaas_backup'@'%';
    FLUSH PRIVILEGES;
    SQL

    # Quoted heredoc: no shell expansion, so the SQL below is passed through verbatim.
    # picopaas_ops: the ONLY thing picopaas_admin can do. Every procedure derives app_<id> from an
    # integer argument (no string identifiers cross the boundary), so it can never touch root,
    # picopaas_backup, mysql.* or the platform schema. _exec is internal and NOT granted.
    mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<'OPS'
    CREATE DATABASE IF NOT EXISTS picopaas_ops;
    DELIMITER $$
    DROP PROCEDURE IF EXISTS picopaas_ops._exec$$
    CREATE PROCEDURE picopaas_ops._exec(IN p_sql TEXT) SQL SECURITY DEFINER
    BEGIN
      SET @pp_sql = p_sql;
      PREPARE pp_stmt FROM @pp_sql;
      EXECUTE pp_stmt;
      DEALLOCATE PREPARE pp_stmt;
    END$$
    DROP PROCEDURE IF EXISTS picopaas_ops.provision_app$$
    CREATE PROCEDURE picopaas_ops.provision_app(IN p_id BIGINT UNSIGNED, IN p_password VARCHAR(255)) SQL SECURITY DEFINER
    BEGIN
      DECLARE v VARCHAR(32);
      IF p_id IS NULL OR p_id < 1 OR p_id > 4294967295 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'invalid app id';
      END IF;
      IF p_password IS NULL OR CHAR_LENGTH(p_password) < 16 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'password too short';
      END IF;
      SET v = CONCAT('app_', p_id);
      CALL picopaas_ops._exec(CONCAT('CREATE DATABASE IF NOT EXISTS `', v, '`'));
      CALL picopaas_ops._exec(CONCAT('DROP USER IF EXISTS ''', v, '''@''%'''));
      CALL picopaas_ops._exec(CONCAT('CREATE USER ''', v, '''@''%'' IDENTIFIED BY ', QUOTE(p_password), ' WITH MAX_USER_CONNECTIONS 5'));
      CALL picopaas_ops._exec(CONCAT('GRANT ALL ON `', v, '`.* TO ''', v, '''@''%'''));
    END$$
    DROP PROCEDURE IF EXISTS picopaas_ops.drop_app$$
    CREATE PROCEDURE picopaas_ops.drop_app(IN p_id BIGINT UNSIGNED) SQL SECURITY DEFINER
    BEGIN
      DECLARE v VARCHAR(32);
      IF p_id IS NULL OR p_id < 1 OR p_id > 4294967295 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'invalid app id';
      END IF;
      SET v = CONCAT('app_', p_id);
      CALL picopaas_ops._exec(CONCAT('DROP DATABASE IF EXISTS `', v, '`'));
      CALL picopaas_ops._exec(CONCAT('DROP USER IF EXISTS ''', v, '''@''%'''));
    END$$
    DROP PROCEDURE IF EXISTS picopaas_ops.set_app_password$$
    CREATE PROCEDURE picopaas_ops.set_app_password(IN p_id BIGINT UNSIGNED, IN p_password VARCHAR(255)) SQL SECURITY DEFINER
    BEGIN
      DECLARE v VARCHAR(32);
      IF p_id IS NULL OR p_id < 1 OR p_id > 4294967295 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'invalid app id';
      END IF;
      IF p_password IS NULL OR CHAR_LENGTH(p_password) < 16 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'password too short';
      END IF;
      SET v = CONCAT('app_', p_id);
      CALL picopaas_ops._exec(CONCAT('ALTER USER ''', v, '''@''%'' IDENTIFIED BY ', QUOTE(p_password)));
    END$$
    DROP PROCEDURE IF EXISTS picopaas_ops.set_app_read_only$$
    CREATE PROCEDURE picopaas_ops.set_app_read_only(IN p_id BIGINT UNSIGNED, IN p_read_only TINYINT) SQL SECURITY DEFINER
    BEGIN
      DECLARE v VARCHAR(32);
      IF p_id IS NULL OR p_id < 1 OR p_id > 4294967295 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'invalid app id';
      END IF;
      SET v = CONCAT('app_', p_id);
      IF p_read_only THEN
        CALL picopaas_ops._exec(CONCAT('REVOKE INSERT, UPDATE, CREATE, ALTER ON `', v, '`.* FROM ''', v, '''@''%'''));
      ELSE
        CALL picopaas_ops._exec(CONCAT('GRANT INSERT, UPDATE, CREATE, ALTER ON `', v, '`.* TO ''', v, '''@''%'''));
      END IF;
    END$$
    DROP PROCEDURE IF EXISTS picopaas_ops.app_size$$
    CREATE PROCEDURE picopaas_ops.app_size(IN p_id BIGINT UNSIGNED) SQL SECURITY DEFINER
    BEGIN
      IF p_id IS NULL OR p_id < 1 OR p_id > 4294967295 THEN
        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'invalid app id';
      END IF;
      SET SESSION information_schema_stats_expiry = 0; -- MySQL 8 caches TABLES sizes for 24h otherwise
      SELECT COALESCE(SUM(data_length + index_length), 0) AS size_bytes
        FROM information_schema.TABLES WHERE table_schema = CONCAT('app_', p_id);
    END$$
    DELIMITER ;
    GRANT EXECUTE ON PROCEDURE picopaas_ops.provision_app TO 'picopaas_admin'@'%';
    GRANT EXECUTE ON PROCEDURE picopaas_ops.drop_app TO 'picopaas_admin'@'%';
    GRANT EXECUTE ON PROCEDURE picopaas_ops.set_app_password TO 'picopaas_admin'@'%';
    GRANT EXECUTE ON PROCEDURE picopaas_ops.set_app_read_only TO 'picopaas_admin'@'%';
    GRANT EXECUTE ON PROCEDURE picopaas_ops.app_size TO 'picopaas_admin'@'%';
    OPS
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: picopaas-data
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: picopaas-data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The official mysql image ships a `mysql` user with uid/gid 999 and its entrypoint skips the
        # root-only chown/gosu path when started as non-root. fsGroup makes the PVC writable by it.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_ROOT_PASSWORD
            # MYSQL_ROOT_HOST deliberately NOT set: the official image then creates only root@localhost,
            # so root cannot log in over the network from any pod (issue #1). Do not set it to "%".
            - name: MYSQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_ADMIN_PASSWORD
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: MYSQL_BACKUP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              # subPath avoids ext4's lost+found at the volume root breaking `--initialize`.
              subPath: data
            - name: config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mysql-config
        - name: initdb
          configMap:
            name: mysql-initdb
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 10Gi
