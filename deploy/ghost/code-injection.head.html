<!-- picopaas-brand: source of truth in deploy/ghost/ ; applied via Ghost Admin API. Theme: Source (html font-size is 62.5%, so 1rem = 10px). -->
<style>
/* picopaas-brand */
:root{
  --pp-bg:#0d0d14;--pp-panel:#14141d;--pp-card:#1a1a26;--pp-border:#33334a;
  --pp-primary:#3a6bd0;--pp-accent:#93b4ec;--pp-text:#f4f4f5;--pp-muted:#b9b9c6;
  --pp-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pp-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Source theme variables: one dark surface, high-contrast text */
  --background-color:#0d0d14;
  --color-white:#fff;--color-black:#000;
  --color-darker-gray:#f4f4f5;--color-dark-gray:#d4d4dc;
  --color-primary-text:#f4f4f5;--color-secondary-text:#b9b9c6;
  --color-lighter-gray:#1a1a26;--color-light-gray:#33334a;--color-mid-gray:#5a5a72;
  --color-border:#33334a;--color-dark-border:#8a8aa3;
  --ghost-accent-color:#3a6bd0;
  --font-sans:var(--pp-sans);--font-serif:var(--pp-sans);--font-serif-alt:var(--pp-sans);--font-mono:var(--pp-mono);
  --gh-font-heading:var(--pp-sans);--gh-font-body:var(--pp-sans);
}
html{color-scheme:dark}
html,body,.gh-viewport,.gh-main,.gh-navigation,.gh-navigation-actions,.gh-footer,.gh-outer{background:var(--pp-bg)!important;color:var(--pp-text)}
body{font-family:var(--pp-sans)!important;font-size:1.7rem;line-height:1.65}
a{text-underline-offset:3px}
.gh-content a:not(.kg-btn):not(.kg-bookmark-container):not(.kg-bookmark-container *){color:var(--pp-accent);text-decoration:underline;text-decoration-color:rgba(147,180,236,.45)}
.gh-content a:hover{color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid var(--pp-accent);outline-offset:2px;border-radius:6px}
::selection{background:rgba(58,107,208,.55);color:#fff}

/* ---- masthead: compact wordmark, no stock cover, no hero form ---- */
.gh-navigation{height:76px;border-bottom:1px solid var(--pp-border)}
.gh-navigation-logo{font-size:2.2rem!important;font-weight:700!important;letter-spacing:-.02em!important;color:#fff!important}
.gh-navigation-logo:before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.5em;border-radius:3px;background:var(--pp-primary);vertical-align:.05em}
.gh-navigation .nav a,.gh-navigation-menu a{font-size:1.6rem;font-weight:500;color:var(--pp-muted)!important;text-decoration:none}
.gh-navigation .nav a:hover,.gh-navigation .nav-current a{color:#fff!important}
.gh-icon-button{color:var(--pp-muted)!important}
.gh-icon-button:hover{color:#fff!important}
.gh-header-image,.gh-header.is-classic.has-image:before{display:none!important}
.gh-header.is-classic{padding-block:56px 20px!important;margin-top:0}
.gh-header.is-classic .gh-header-inner{align-items:flex-start;text-align:left;max-width:var(--container-width,1320px);gap:0}
.gh-header-inner,.gh-header.is-classic.has-image .gh-header-inner{color:var(--pp-text)}
.gh-header-title{font-size:clamp(2.8rem,2.2vw + 1.8rem,4rem)!important;font-weight:700!important;letter-spacing:-.025em!important;line-height:1.15!important;color:#fff!important;max-width:22ch}

/* ---- headings + article ---- */
.is-title,h1,h2,h3,h4,h5,h6{font-family:var(--pp-sans)!important;color:#fff;letter-spacing:-.02em}
.gh-article-title{font-size:clamp(3.4rem,2vw + 2.4rem,5rem)!important;font-weight:800!important;line-height:1.12!important;color:#fff}
.gh-article-excerpt{font-size:2.1rem!important;line-height:1.5;color:var(--pp-muted)!important}
.gh-article-meta,.gh-article-meta *,.gh-article-meta-date,.gh-article-meta-length,.gh-article-author-name{color:var(--pp-muted)!important;font-size:1.5rem}
.gh-article-tag{font-family:var(--pp-mono);font-size:1.3rem!important;letter-spacing:.04em;color:var(--pp-accent)!important}
.gh-content{font-size:1.9rem!important;line-height:1.7!important;letter-spacing:0!important;color:var(--pp-text)}
.gh-content>*{max-width:760px}
.gh-content>.kg-width-wide,.gh-content>.kg-width-full,.gh-content>pre,.gh-content>table{max-width:none}
.gh-content p,.gh-content li,.gh-content dd,.gh-content td{color:var(--pp-text);font-size:inherit;line-height:1.7}
.gh-content h1{font-size:4rem;line-height:1.2}
.gh-content h2{font-size:3.2rem;font-weight:700;line-height:1.25;margin-top:1.8em;padding-bottom:.3em;border-bottom:1px solid var(--pp-border)}
.gh-content h3{font-size:2.5rem;font-weight:700;line-height:1.3;margin-top:1.5em}
.gh-content h4{font-size:2.1rem;font-weight:700}
.gh-content strong{color:#fff}
.gh-content hr{border:0;border-top:1px solid var(--pp-border);background:none}
.gh-content blockquote,.gh-content blockquote.kg-blockquote-alt{padding:.3em 1.2em;border:0!important;border-left:3px solid var(--pp-primary)!important;background:var(--pp-panel);border-radius:0 8px 8px 0;color:var(--pp-text)!important;font-style:normal}
.gh-content blockquote p{color:var(--pp-text)}
.gh-content code,.gh-content kbd{font-family:var(--pp-mono)!important;font-size:.85em;background:var(--pp-card)!important;color:#d6e2f7!important;border:1px solid var(--pp-border);border-radius:5px;padding:.12em .4em}
.gh-content pre{font-family:var(--pp-mono)!important;font-size:1.55rem;background:var(--pp-panel)!important;color:var(--pp-text)!important;border:1px solid var(--pp-border);border-radius:8px;padding:1.1em 1.3em;overflow:auto;line-height:1.55}
.gh-content pre code{background:none!important;border:0;padding:0;color:inherit!important;font-size:inherit}
.gh-content table{border-collapse:collapse;font-size:1.65rem}
.gh-content th,.gh-content td{border:1px solid var(--pp-border)!important;padding:.55em .8em;text-align:left}
.gh-content th{color:#fff;background:var(--pp-panel)}
.gh-content img,.kg-image{border-radius:8px}
.gh-content figcaption{color:var(--pp-muted)!important;font-size:1.45rem}
.kg-bookmark-container,.kg-callout-card,.kg-toggle-card{background:var(--pp-panel)!important;border:1px solid var(--pp-border)!important;border-radius:8px!important;color:var(--pp-text)!important}
.kg-bookmark-title{color:#fff!important}.kg-bookmark-description,.kg-bookmark-metadata{color:var(--pp-muted)!important}
.kg-callout-text{color:var(--pp-text)!important}

/* ---- post lists / cards: transparent on the single surface, bordered ---- */
.gh-container-title{font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pp-muted)!important}
.gh-card{background:transparent}
.gh-card-title{font-size:2.3rem!important;font-weight:700!important;line-height:1.25!important;color:#fff}
.gh-card-excerpt{font-size:1.65rem!important;line-height:1.55!important;color:var(--pp-muted)!important}
.gh-card-meta,.gh-card-meta *,.gh-card-date,.gh-card-author{color:var(--pp-muted)!important;font-size:1.4rem!important}
.gh-card-tag{color:var(--pp-accent)!important;font-family:var(--pp-mono)}
.gh-card-image{background:var(--pp-card)!important;border-radius:8px;overflow:hidden}
/* the theme already draws a divider between cards (.gh-card+.gh-card:before); no extra border here */
.gh-container.is-list .gh-card,.gh-container.is-grid .gh-card{padding-bottom:28px}

/* ---- non-subscribe buttons (kg-btn etc.) ---- */
.gh-button,.kg-btn,.kg-button-card a.kg-btn{background:var(--pp-primary)!important;color:#fff!important;border-radius:6px!important;font-weight:600;box-shadow:none!important}
.gh-button:hover,.kg-btn:hover{background:#2f5fc4!important}
input,textarea,select{background:var(--pp-card)!important;color:#fff!important;border:1px solid #8a8aa3!important;border-radius:6px}
input::placeholder{color:#9b9bb0}

/* ---- footer ---- */
.gh-footer{margin-top:80px!important;border-top:1px solid var(--pp-border);color:var(--pp-muted)}
.gh-footer-bar{border:0!important;margin-bottom:40px!important;padding-block:32px!important}
.gh-footer a,.gh-footer-copyright,.gh-footer-logo{color:var(--pp-muted)!important}
.gh-footer-logo{color:#fff!important;font-size:2rem!important}
.gh-footer a:hover{color:#fff!important}

/* ---- HIDE ALL MEMBERSHIP / SUBSCRIBE UI (memberships are not configured; no email) ---- */
.gh-navigation-members,
.gh-navigation-actions a[data-portal],
a[data-portal],
.gh-header .gh-form,
.gh-footer-signup,
.gh-form,
form[data-members-form],
.nav-sign-up,.nav-sign-in,.nav-subscribe,.nav-signin,.nav-signup,
.gh-footer-menu li:has(a[href*="#/portal"]),
.gh-navigation li:has(a[href*="#/portal"]),
a[href^="#/portal"],
.gh-portal-triggerbtn-iframe,.gh-portal-triggerbtn-container,
iframe[title*="portal" i],iframe[title*="membership" i],
#ghost-portal-root,
.gh-post-upgrade-cta,.gh-post-upgrade-cta-content,.gh-cta,.gh-cta-gradient,
.gh-article-author-box,.gh-subscribe,.kg-signup-card,.kg-cta-card{display:none!important}
.gh-navigation-actions:not(:has(.gh-search)){display:none!important}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
