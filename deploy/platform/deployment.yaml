# Platform Deployment: FastAPI + Vue (built-in) + in-process reconciler (ARCHITECTURE.md §2).
# Secrets `picopaas-env` and `picopaas-db-ca` are NOT in this repo. .github/workflows/bootstrap.yml
# creates them (idempotently); see deploy/README.md "Secrets" for the keys (SECRET_KEY, FERNET_KEY,
# DATABASE_URL, DIGITALOCEAN_TOKEN, SPACES_*, BOOTSTRAP_DB_*, MYSQL_EGRESS_*, RECONCILER_ENABLED, ...).
# `picopaas-db-ca` (key ca.crt) is the managed-MySQL CA; DATABASE_URL points at it via ?ssl_ca=.
# The image tag below is a placeholder: bootstrap.yml / deploy.yml set the real short-sha tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picopaas
  namespace: picopaas-system
  labels:
    app: picopaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picopaas
  template:
    metadata:
      labels:
        app: picopaas
    spec:
      serviceAccountName: picopaas
      automountServiceAccountToken: true # the reconciler needs the k8s API; app pods disable this (ARCHITECTURE.md)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: picopaas
          image: ghcr.io/seaburr/picopaas:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: picopaas-env
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/picopaas/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-ca
          secret:
            secretName: picopaas-db-ca
            optional: true # absent for in-cluster MySQL
