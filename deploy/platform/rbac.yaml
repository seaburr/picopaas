# Minimum RBAC for the picopaas reconciler (in-process APScheduler loop inside the api pod,
# ARCHITECTURE.md §2) to manage per-app namespaces. No wildcards, no escalate/impersonate, no node writes, no
# exec/attach/portforward.
#
# Two-tier grant (PENTEST #19 steps 1-2, then the PENTEST MEDIUM "reconciler SA has cluster-wide app-resource writes"):
#   * ClusterRole picopaas-reconciler (bound CLUSTER-WIDE below) holds ONLY what has to exist before an app namespace does,
#     or is inherently cross-namespace: namespaces, the per-namespace RoleBinding bootstrap (+ `bind`), and read-only
#     pods / pod logs / nodes / metrics.
#   * ClusterRole picopaas-app-ns holds every WRITE the reconciler makes INSIDE a namespace (secrets, services,
#     resourcequotas, limitranges, deployments, ingresses, networkpolicies). It is bound per namespace by a RoleBinding the
#     reconciler applies right after the Namespace (app/k8s_manifests.py flatten_manifests order: Namespace, RoleBinding, then
#     everything else) and, for the platform's own namespace, by the RoleBinding below. A ClusterRole referenced from a
#     RoleBinding is scoped to that RoleBinding's namespace, so the SA can NOT write Deployments / Ingresses /
#     NetworkPolicies / Secrets in kube-system, default, cert-manager, traefik, ...
#   * Residual ("bind anywhere"): the SA still has create/patch on rolebindings cluster-wide plus `bind` on picopaas-app-ns
#     (resourceNames-limited, no `escalate`), so by RBAC alone it could bind itself into ANY namespace. The
#     ValidatingAdmissionPolicy at the bottom of this file closes that: RoleBindings written by this SA are only admitted
#     in app-* namespaces (tightened from app-* / picopaas-*; pentest N1).
#
# Apply order matters (kubectl apply -f is sequential): picopaas-app-ns is applied BEFORE picopaas-reconciler so there is
# never a moment where the SA has lost the cluster-wide grant but not yet gained the namespaced one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picopaas
  namespace: picopaas-system
---
# Namespaced grant, only ever bound via a RoleBinding inside app-<id> / picopaas-system
# (a ClusterRole referenced from a RoleBinding is scoped to that RoleBinding's namespace).
# Everything here is something the reconciler writes inside an app namespace (see app/k8s_manifests.py render_app_manifests,
# app/providers/kube.py apply/delete_ingress/get_status). Never bind this role with a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-app-ns
rules:
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Delete finished (Succeeded/Failed, e.g. Evicted) pods so they don't pile up (kubelet GC threshold is 12500).
  # Namespaced on purpose: the cluster-wide role stays read-only for pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # The app's Deployment (server-side apply = patch; get_status lists them).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Default-deny + allow-* NetworkPolicies, and the primary + custom-domain Ingresses (delete_ingress on suspend / detach).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-reconciler
rules:
  # Create/teardown of per-app namespaces (ns: app-<id>). `patch` is required: the reconciler uses server-side apply,
  # which is a PATCH even for creation. (It also lets the platform relabel any namespace; see PENTEST #19.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "patch"]

  # Per-namespace RoleBindings (see picopaas-app-ns). Cluster-wide only because the RoleBinding is what GRANTS the
  # namespaced access, so it has to be creatable in a brand-new namespace before the SA holds any rights there. `bind` is
  # limited to that one ClusterRole by resourceNames, and there is no `escalate`, so this can't be used to hand out any other
  # permission. Server-side apply = patch. Where it may be used is further restricted by the admission policy below.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["picopaas-app-ns"]

  # Pod status only — no delete (finished-pod delete lives in picopaas-app-ns), no exec/attach/portforward subresources. Cluster-wide: app_pod_events() and the admin
  # health snapshot list pods across all namespaces.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Container logs for GET /apps/{id}/logs (read-only; the API only ever asks for app-<id> namespaces).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Kubernetes Events for GET /apps/{id}/pods/{pod}/events (read-only; the API only lists app-<id> namespaces).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]

  # Read-only, for GET /admin/health (admin dashboard): node capacity + usage from metrics.k8s.io.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
# The platform's own namespace: grants picopaas-app-ns (incl. the secrets/deployments/... it used to hold cluster-wide)
# inside picopaas-system, so narrowing picopaas-reconciler above doesn't change what the SA can do there.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: picopaas-platform
  namespace: picopaas-system
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-app-ns
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: picopaas-reconciler
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-reconciler
  apiGroup: rbac.authorization.k8s.io
---
# Closes the "bind anywhere" residual: the platform ServiceAccount may only create/update RoleBindings in app-*
# namespaces (the only place the reconciler writes one at runtime), never in kube-system, default, cert-manager, traefik,
# picopaas-data (in-cluster MySQL admin Secret, pentest N1) or picopaas-system. The picopaas-system RoleBinding above is
# applied by bootstrap/deploy with the CI cluster-admin credential, which this policy does not match.
# Scoped by matchConditions to this one SA, so it does not affect any other user, controller or `kubectl apply` by
# an admin/CI. failurePolicy Fail so an evaluation error denies rather than silently allows (the expression below only
# reads request fields that always exist, so it cannot error in practice).
# Rollback if it ever misbehaves: `kubectl delete validatingadmissionpolicybinding picopaas-rolebinding-scope`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: picopaas-rolebinding-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: only-platform-serviceaccount
      expression: 'request.userInfo.username == "system:serviceaccount:picopaas-system:picopaas"'
  validations:
    - expression: "request.namespace.startsWith('app-')"
      messageExpression: "'the platform service account may only create RoleBindings in app-* namespaces, not in ' + request.namespace"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: picopaas-rolebinding-scope
spec:
  policyName: picopaas-rolebinding-scope
  validationActions: ["Deny"]
