# Minimum RBAC for the picopaas reconciler (in-process APScheduler loop inside the api pod,
# ARCHITECTURE.md §2) to manage per-app namespaces. No wildcards, no RBAC self-management
# (roles/rolebindings/clusterroles/clusterrolebindings), no escalate/bind/impersonate, no
# node writes, no exec/attach/portforward, no access to Secrets outside what's listed below.
#
# MIGRATION (PENTEST #19), step 1 of 2 (this file): the reconciler now creates a per-namespace RoleBinding
# (app-<id>/picopaas-platform -> ClusterRole picopaas-app-ns, below) in every app namespace on its next sweep. The
# broad cluster-wide secrets/resourcequotas/limitranges/services grant in picopaas-reconciler is DELIBERATELY still
# here. Step 2 (SEPARATE later deploy, only after the reconciler has swept once post-deploy): delete that rule
# block from picopaas-reconciler. See docs/QUESTIONS.md.
#
# WARNING (flag for scm-security, see deploy/README.md "Known RBAC exposure"): `secrets` get/
# list/watch/create/update/patch/delete is granted at CLUSTER scope (no per-namespace Role is
# possible here because the reconciler must touch an arbitrary, dynamically-created namespace
# per app). That means a compromised platform pod can read every Secret in every app namespace
# cluster-wide — not just its own. There's no RBAC primitive to say "any namespace, but only
# Secrets this controller itself created." Mitigations to consider later: namespace-scoped
# Roles created per app namespace instead of one ClusterRole (more moving parts), or splitting
# a narrower "cert/env Secrets only" controller from anything higher-privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picopaas
  namespace: picopaas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-reconciler
rules:
  # Create/teardown of per-app namespaces (ns: app-<id>). `patch` is required: the reconciler uses server-side apply,
  # which is a PATCH even for creation. (It also lets the platform relabel any namespace; see PENTEST #19.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "patch"]

  # Per-app-namespace objects the reconciler manages (quota, env/cred secrets, Service).
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Per-namespace RoleBindings (see picopaas-app-ns). `bind` is limited to that one ClusterRole by resourceNames, and
  # there is no `escalate`, so this can't be used to hand out any other permission. Server-side apply = patch.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["picopaas-app-ns"]

  # Pod status only — no delete, no exec/attach/portforward subresources.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Container logs for GET /apps/{id}/logs (read-only; the API only ever asks for app-<id> namespaces).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Read-only, for GET /admin/health (admin dashboard): node capacity + usage from metrics.k8s.io.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Namespaced grant, only ever bound via a RoleBinding inside app-<id> / picopaas-system / picopaas-data
# (a ClusterRole referenced from a RoleBinding is scoped to that RoleBinding's namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-app-ns
rules:
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# The platform's own secrets (picopaas-env etc.) and the in-cluster MySQL secrets, so step 2 doesn't break them.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: picopaas-platform
  namespace: picopaas-system
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-app-ns
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: picopaas-reconciler
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-reconciler
  apiGroup: rbac.authorization.k8s.io
