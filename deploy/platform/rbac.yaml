# Minimum RBAC for the picopaas reconciler (in-process APScheduler loop inside the api pod,
# ARCHITECTURE.md §2) to manage per-app namespaces. No wildcards, no RBAC self-management
# (roles/rolebindings/clusterroles/clusterrolebindings), no escalate/bind/impersonate, no
# node writes, no exec/attach/portforward, no access to Secrets outside what's listed below.
#
# PENTEST #19 step 2 of 2 (done): secrets/resourcequotas/limitranges/services are NO LONGER granted cluster-wide. The
# platform SA gets them only through RoleBindings to ClusterRole picopaas-app-ns, created per app-<id> namespace by the
# reconciler (applied right after the Namespace, before any Secret/Service) and in picopaas-system (below). Residual:
# the SA keeps `bind` on picopaas-app-ns (resourceNames-limited, no `escalate`), so a compromised platform pod could
# bind itself into another namespace; this narrows, not eliminates, the blast radius. Accepted/documented.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picopaas
  namespace: picopaas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-reconciler
rules:
  # Create/teardown of per-app namespaces (ns: app-<id>). `patch` is required: the reconciler uses server-side apply,
  # which is a PATCH even for creation. (It also lets the platform relabel any namespace; see PENTEST #19.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "patch"]

  # Per-namespace RoleBindings (see picopaas-app-ns). `bind` is limited to that one ClusterRole by resourceNames, and
  # there is no `escalate`, so this can't be used to hand out any other permission. Server-side apply = patch.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["picopaas-app-ns"]

  # Pod status only — no delete, no exec/attach/portforward subresources.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Container logs for GET /apps/{id}/logs (read-only; the API only ever asks for app-<id> namespaces).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Read-only, for GET /admin/health (admin dashboard): node capacity + usage from metrics.k8s.io.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Namespaced grant, only ever bound via a RoleBinding inside app-<id> / picopaas-system / picopaas-data
# (a ClusterRole referenced from a RoleBinding is scoped to that RoleBinding's namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-app-ns
rules:
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# The platform's own secrets (picopaas-env etc.) and the in-cluster MySQL secrets, so step 2 doesn't break them.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: picopaas-platform
  namespace: picopaas-system
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-app-ns
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: picopaas-reconciler
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-reconciler
  apiGroup: rbac.authorization.k8s.io
