# Minimum RBAC for the picopaas reconciler (in-process APScheduler loop inside the api pod,
# ARCHITECTURE.md §2) to manage per-app namespaces. No wildcards, no RBAC self-management
# (roles/rolebindings/clusterroles/clusterrolebindings), no escalate/bind/impersonate, no
# nodes, no exec/attach/portforward, no access to Secrets outside what's listed below.
#
# WARNING (flag for scm-security, see deploy/README.md "Known RBAC exposure"): `secrets` get/
# list/watch/create/update/patch/delete is granted at CLUSTER scope (no per-namespace Role is
# possible here because the reconciler must touch an arbitrary, dynamically-created namespace
# per app). That means a compromised platform pod can read every Secret in every app namespace
# cluster-wide — not just its own. There's no RBAC primitive to say "any namespace, but only
# Secrets this controller itself created." Mitigations to consider later: namespace-scoped
# Roles created per app namespace instead of one ClusterRole (more moving parts), or splitting
# a narrower "cert/env Secrets only" controller from anything higher-privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: picopaas
  namespace: picopaas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: picopaas-reconciler
rules:
  # Create/teardown of per-app namespaces (ns: app-<id>). `patch` is required: the reconciler uses server-side apply,
  # which is a PATCH even for creation. (It also lets the platform relabel any namespace; see PENTEST #19.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "patch"]

  # Per-app-namespace objects the reconciler manages (quota, env/cred secrets, Service).
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Pod status only — no delete, no exec/attach/portforward subresources.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: picopaas-reconciler
subjects:
  - kind: ServiceAccount
    name: picopaas
    namespace: picopaas-system
roleRef:
  kind: ClusterRole
  name: picopaas-reconciler
  apiGroup: rbac.authorization.k8s.io
