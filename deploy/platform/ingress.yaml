# TLS not set explicitly: ingress-nginx's default-ssl-certificate (the wildcard cert) covers
# picopaas.seaburr.io already, so no per-host tls/secretName block is needed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: picopaas
  namespace: picopaas-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: picopaas.seaburr.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: picopaas
                port:
                  number: 80
