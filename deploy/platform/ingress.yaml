# Hosts-only tls (no secretName): Traefik's default TLSStore (the wildcard cert) covers
# picopaas.raisehellpraisedale.xyz; tls.hosts just makes Traefik serve it on websecure.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: picopaas
  namespace: picopaas-system
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - picopaas.raisehellpraisedale.xyz
  rules:
    - host: picopaas.raisehellpraisedale.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: picopaas
                port:
                  number: 80
