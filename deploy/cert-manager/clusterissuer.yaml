# Let's Encrypt ClusterIssuers, DNS-01 via the DigitalOcean solver.
#
# Prereq (NOT in this repo — create by hand before applying this file):
#   kubectl create secret generic digitalocean-dns \
#     -n cert-manager \
#     --from-literal=access-token='<DO_API_TOKEN_PLACEHOLDER>'
#
# The token needs DNS read/write scope for the raisehellpraisedale.xyz domain only (DO tokens are
# account-wide, so scope what you can via a dedicated token if DO's token UI allows it).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: yz80nomo+lepaas@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: yz80nomo+lepaas@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
