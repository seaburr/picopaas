# Helm values for the cert-manager chart (https://github.com/cert-manager/cert-manager).
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace -f values.yaml
#
# crds.enabled installs the CRDs with the chart (simplest for a single cluster with no GitOps CRD
# management); crds.keep stops `helm uninstall` from deleting them (and every Certificate with them).
# `installCRDs` is deprecated since chart v1.15.
crds:
  enabled: true
  keep: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
