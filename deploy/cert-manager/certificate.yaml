# Wildcard cert for *.raisehellpraisedale.xyz (+ the apex), used as Traefik's default TLS cert
# (TLSStore `default`, see deploy/traefik/values.yaml; secret must live in ns traefik). One cert, no per-app
# issuance, so no Let's Encrypt rate-limit risk as apps are created/deleted.
#
# Switch issuerRef.name to letsencrypt-staging first to confirm DNS-01 works before burning
# prod rate limits, then re-apply with letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-raisehellpraisedale-xyz
  namespace: traefik
spec:
  secretName: wildcard-raisehellpraisedale-xyz-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "raisehellpraisedale.xyz"
    - "*.raisehellpraisedale.xyz"
