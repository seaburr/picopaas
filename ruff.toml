# Lint only (no `ruff format`). Defaults are E4, E7, E9, F; long lines are deliberate (no E501).
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py", "alembic/**/*.py", "images/**/*.py"]
extend-exclude = ["data", "frontend", "static", "e2e", "eval-data"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# pytest fixtures are imported from conftest and then taken as arguments
"tests/**" = ["F811"]
