name: bootstrap

# One-shot, re-runnable cluster bring-up for the managed-MySQL + LB variant (deploy/README.md steps 2-8).
# Run by hand after the terraform workflow has created the cluster. Idempotent: helm upgrade --install,
# kubectl apply, DNS upserts, and existing secrets (platform DB password) are
# read back and never rotated. Never touches TXT or any DNS record other than A `*`, `@`, `platform` and `lb`.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (short or full) whose image to deploy; default = current ref"
        required: false
      backup_image_digest:
        description: "Optional sha256:<64 hex> of ghcr.io/seaburr/picopaas-backup to pin; default = resolve :latest at run time"
        required: false
      kaisen_runtime_image_digest:
        description: "Optional sha256:<64 hex> of ghcr.io/seaburr/picopaas-kaisen-runtime to pin as KAISEN_RUNTIME_IMAGE; default = resolve :latest at run time"
        required: false
      rotate_backup_key:
        description: "Create a fresh bucket-scoped backup Spaces key (picopaas-backups only) and revoke the old one after the rollout"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy # shares a lock with deploy.yml so the two never race
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pinned chart versions (looked up 2026-10-19 with `helm search repo`). Bump deliberately.
      TRAEFIK_CHART_VERSION: "42.0.0"
      CERT_MANAGER_CHART_VERSION: "v1.21.2"
      METRICS_SERVER_CHART_VERSION: "3.14.0" # app v0.9.0
      CLUSTER_NAME: picopaas-nyc3
      VPC_NAME: picopaas-nyc3
      DB_CLUSTER_NAME: picopaas-mysql-nyc3
      PG_CLUSTER_NAME: picopaas-pg-nyc3
      DOMAIN: picopaas.xyz
      PLATFORM_HOST: platform.picopaas.xyz
      SPACES_REGION: atl1
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - name: Skip if no DigitalOcean token or cluster yet
        id: gate
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ]; then
            echo "::notice::DIGITALOCEAN_TOKEN is not set; skipping bootstrap."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" "https://api.digitalocean.com/v2/kubernetes/clusters" \
              | jq -e --arg n "$CLUSTER_NAME" '.kubernetes_clusters[] | select(.name == $n)' >/dev/null; then
            echo "::notice::cluster $CLUSTER_NAME doesn't exist yet; skipping bootstrap (run the terraform workflow first)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SPACES_ACCESS_KEY_ID" ] || [ -z "$SPACES_SECRET_ACCESS_KEY" ]; then
            echo "::notice::SPACES_ACCESS_KEY_ID/SPACES_SECRET_ACCESS_KEY not set; skipping bootstrap."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - name: Work out image tag
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          CUR_SHA: ${{ github.sha }}
        run: |
          full="${INPUT_SHA:-$CUR_SHA}"
          if ! echo "$full" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::sha must be 7-40 hex chars"; exit 1
          fi
          echo "IMAGE=ghcr.io/seaburr/picopaas:$(echo "$full" | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: steps.gate.outputs.run == 'true'
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        if: steps.gate.outputs.run == 'true'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.gate.outputs.run == 'true'

      - name: Save kubeconfig and wait for nodes
        if: steps.gate.outputs.run == 'true'
        run: |
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

      # ---- step 3: Traefik (creates the DO load balancer; chart CRDs installed for the default TLSStore) ----
      # Cluster replacement leaves the old cluster's load balancer behind, still holding the LB name we use
      # (deploy/traefik/values.yaml do-loadbalancer-name: picopaas). DO LBs here carry no tags, so identify the LIVE
      # one by the id the DO cloud-controller writes onto the Traefik Service, and only ever delete other LBs named
      # picopaas. If the Service exists but its LB id can't be read, delete nothing.
      - name: Delete orphaned load balancers
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          live_id=""
          # Only a definite NotFound means "no Service yet"; any other kubectl error aborts (never guess).
          if out=$(kubectl -n traefik get svc traefik \
                -o jsonpath='{.metadata.annotations.kubernetes\.digitalocean\.com/load-balancer-id}' 2>&1); then
            live_id="$out"
            if [ -z "$live_id" ]; then
              echo "::warning::traefik Service exists but has no load-balancer-id yet; skipping orphan cleanup"
              exit 0
            fi
          elif grep -q 'NotFound' <<<"$out"; then
            live_id=""
          else
            echo "::error::could not read the traefik Service ($out); refusing to touch load balancers"; exit 1
          fi
          echo "live LB id: ${live_id:-<none: no traefik Service in this cluster yet>}"
          doctl compute load-balancer list -o json \
            | jq -r --arg live "$live_id" '.[] | select(.name == "picopaas" and .id != $live) | .id' \
            | while read -r id; do
                echo "deleting orphaned LB picopaas ($id)"
                doctl compute load-balancer delete "$id" --force
              done
      - name: Install Traefik
        if: steps.gate.outputs.run == 'true'
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik \
            -n traefik --create-namespace \
            --version "$TRAEFIK_CHART_VERSION" \
            -f deploy/traefik/values.yaml \
            --wait --timeout 10m

      # ---- step 4: cert-manager (CRDs come from deploy/cert-manager/values.yaml: crds.enabled) ----
      - name: Install cert-manager
        if: steps.gate.outputs.run == 'true'
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace \
            --version "$CERT_MANAGER_CHART_VERSION" \
            -f deploy/cert-manager/values.yaml \
            --wait --timeout 10m

      # metrics-server: not preinstalled on this DOKS cluster; the admin health endpoint needs metrics.k8s.io.
      - name: Install metrics-server
        if: steps.gate.outputs.run == 'true'
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            -n kube-system \
            --version "$METRICS_SERVER_CHART_VERSION" \
            -f deploy/metrics-server/values.yaml \
            --wait --timeout 5m
          for i in $(seq 1 30); do
            st=$(kubectl get apiservice v1beta1.metrics.k8s.io -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || true)
            [ "$st" = "True" ] && { echo "metrics API available"; exit 0; }
            echo "waiting for metrics APIService ($i/30)"; sleep 10
          done
          echo "::error::v1beta1.metrics.k8s.io not Available after 5 minutes"
          kubectl get apiservice v1beta1.metrics.k8s.io -o yaml || true
          exit 1

      # The Service carries do-loadbalancer-hostname, so the CCM publishes status.hostname (not .ip) and the IP
      # comes from the DO API. The annotation only sets that field; it does not need the DNS record to exist first.
      - name: Wait for the load balancer IP
        if: steps.gate.outputs.run == 'true'
        run: |
          ip=""
          for i in $(seq 1 60); do
            ip=$(doctl compute load-balancer list -o json \
              | jq -r '[.[] | select(.name == "picopaas" and .status == "active" and .ip != "")][0].ip // empty')
            [ -n "$ip" ] && break
            echo "waiting for LB IP ($i/60)"; sleep 10
          done
          if [ -z "$ip" ]; then echo "::error::no LB IP after 10 minutes"; exit 1; fi
          echo "LB_IP=$ip" >> "$GITHUB_ENV"
          echo "LB IP: $ip"

      # ---- DNS: only A records `*`, `@` (apex), `platform` and `lb` (lb = do-loadbalancer-hostname hairpin fix). TXT and everything else are never listed for write. ----
      - name: Upsert DNS A records
        if: steps.gate.outputs.run == 'true'
        run: |
          records=$(doctl compute domain records list "$DOMAIN" -o json)
          for name in '*' '@' platform lb; do
            id=$(echo "$records" | jq -r --arg n "$name" '[.[] | select(.type == "A" and .name == $n)][0].id // empty')
            cur=$(echo "$records" | jq -r --arg n "$name" '[.[] | select(.type == "A" and .name == $n)][0].data // empty')
            if [ -z "$id" ]; then
              echo "creating A $name -> $LB_IP"
              doctl compute domain records create "$DOMAIN" --record-type A --record-name "$name" \
                --record-data "$LB_IP" --record-ttl 300 >/dev/null
            elif [ "$cur" != "$LB_IP" ]; then
              echo "updating A $name: $cur -> $LB_IP"
              doctl compute domain records update "$DOMAIN" --record-id "$id" --record-type A \
                --record-name "$name" --record-data "$LB_IP" --record-ttl 300 >/dev/null
            else
              echo "A $name already -> $LB_IP"
            fi
          done

      # ---- secrets ----
      - name: cert-manager DNS token secret
        if: steps.gate.outputs.run == 'true'
        run: |
          kubectl -n cert-manager create secret generic digitalocean-dns \
            --from-literal=access-token="$DIGITALOCEAN_TOKEN" --dry-run=client -o yaml | kubectl apply -f -

      - name: Platform namespace and RBAC
        if: steps.gate.outputs.run == 'true'
        run: kubectl apply -f deploy/platform/namespace.yaml -f deploy/platform/rbac.yaml

      - name: Look up managed MySQL, VPC and CA
        if: steps.gate.outputs.run == 'true'
        run: |
          db_id=$(doctl databases list -o json | jq -r --arg n "$DB_CLUSTER_NAME" '.[] | select(.name == $n) | .id')
          [ -n "$db_id" ] || { echo "::error::managed MySQL $DB_CLUSTER_NAME not found"; exit 1; }
          conn=$(doctl databases connection "$db_id" --private -o json)
          admin_host=$(echo "$conn" | jq -r 'if type == "array" then .[0] else . end | .host')
          admin_port=$(echo "$conn" | jq -r 'if type == "array" then .[0] else . end | .port')
          admin_user=$(echo "$conn" | jq -r 'if type == "array" then .[0] else . end | .user')
          admin_pw=$(echo "$conn" | jq -r 'if type == "array" then .[0] else . end | .password')
          echo "::add-mask::$admin_pw"
          vpc_cidr=$(doctl vpcs list -o json | jq -r --arg n "$VPC_NAME" '.[] | select(.name == $n) | .ip_range')
          [ -n "$vpc_cidr" ] || { echo "::error::VPC $VPC_NAME not found"; exit 1; }
          # CA bundle for TLS to managed MySQL (public data, but kept in a Secret for mounting).
          curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" "https://api.digitalocean.com/v2/databases/$db_id/ca" \
            | jq -r '.ca.certificate' | base64 -d > "$RUNNER_TEMP/db-ca.crt"
          grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/db-ca.crt" || { echo "::error::could not fetch DB CA"; exit 1; }
          {
            echo "ADMIN_HOST=$admin_host"
            echo "ADMIN_PORT=$admin_port"
            echo "ADMIN_USER=$admin_user"
            echo "ADMIN_PW=$admin_pw"
            echo "VPC_CIDR=$vpc_cidr"
          } >> "$GITHUB_ENV"
          echo "db host (private): $admin_host:$admin_port, vpc cidr: $vpc_cidr"

          # Managed PostgreSQL (request 0006), same lookup path as MySQL (doctl + DO API, no TF outputs needed).
          # Optional: if the cluster does not exist yet, the platform simply has no 'primary-pg' DbServer.
          pg_id=$(doctl databases list -o json | jq -r --arg n "$PG_CLUSTER_NAME" '.[] | select(.name == $n) | .id')
          if [ -n "$pg_id" ]; then
            pgconn=$(doctl databases connection "$pg_id" --private -o json)
            pg_pw=$(echo "$pgconn" | jq -r 'if type == "array" then .[0] else . end | .password')
            echo "::add-mask::$pg_pw"
            curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" "https://api.digitalocean.com/v2/databases/$pg_id/ca" \
              | jq -r '.ca.certificate' | base64 -d > "$RUNNER_TEMP/pg-ca.crt"
            grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/pg-ca.crt" || { echo "::error::could not fetch PG CA"; exit 1; }
            {
              echo "PG_HOST=$(echo "$pgconn" | jq -r 'if type == "array" then .[0] else . end | .host')"
              echo "PG_PORT=$(echo "$pgconn" | jq -r 'if type == "array" then .[0] else . end | .port')"
              echo "PG_USER=$(echo "$pgconn" | jq -r 'if type == "array" then .[0] else . end | .user')"
              echo "PG_PW=$pg_pw"
            } >> "$GITHUB_ENV"
            echo "pg host (private) found; CA fetched"
          else
            echo "::notice::managed PostgreSQL $PG_CLUSTER_NAME not found; skipping BOOTSTRAP_PG_*"
          fi

      # Request 0007 (persistent volumes): the feature is only safe if deleting a PVC deletes the DO volume (else orphaned
      # volumes keep billing at $0.10/GiB/mo) and PVCs can be grown. Verify before VOLUMES_ENABLED=1 goes into picopaas-env.
      - name: Check volume StorageClass
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sc=$(kubectl get storageclass do-block-storage -o json)
          policy=$(jq -r '.reclaimPolicy // "unset"' <<<"$sc")
          expand=$(jq -r '.allowVolumeExpansion // false' <<<"$sc")
          echo "do-block-storage: reclaimPolicy=$policy allowVolumeExpansion=$expand"
          if [ "$policy" != "Delete" ]; then
            echo "::error::do-block-storage reclaimPolicy is $policy, not Delete; deleted apps would leave billing volumes behind (request 0007)"
            exit 1
          fi
          if [ "$expand" != "true" ]; then
            echo "::warning::do-block-storage does not allow volume expansion; admin volume grow will fail (request 0007)"
          fi

      - name: Platform secrets (picopaas-env, picopaas-db-ca)
        if: steps.gate.outputs.run == 'true'
        env:
          PICOPAAS_FERNET_KEY: ${{ secrets.PICOPAAS_FERNET_KEY }}
          BACKUP_IMAGE_DIGEST_INPUT: ${{ inputs.backup_image_digest }}
          KAISEN_RUNTIME_DIGEST_INPUT: ${{ inputs.kaisen_runtime_image_digest }}
          ROTATE_BACKUP_KEY: ${{ inputs.rotate_backup_key }}
        run: |
          set -euo pipefail
          ns=picopaas-system
          # Fail closed: only NotFound may be treated as "no existing secret"; any other error aborts so the
          # old FERNET_KEY (needed to decrypt stored data) is never lost.
          err=$(mktemp)
          if existing=$(kubectl -n $ns get secret picopaas-env -o json 2>"$err"); then :
          elif grep -q 'NotFound' "$err"; then existing=""
          else echo "::error::could not read existing picopaas-env secret: $(head -c 300 "$err")"; exit 1; fi
          get() { echo "$existing" | jq -r --arg k "$1" '.data[$k] // empty | @base64d'; }

          # FERNET_KEY is the ONLY platform key (SECRET_KEY for JWTs is derived from it in app/config.py). It comes
          # from a GitHub secret so it survives losing the cluster: it decrypts every secret stored in MySQL.
          FERNET_KEY="$PICOPAAS_FERNET_KEY"
          [ -n "$FERNET_KEY" ] || {
            echo "::error::set repo secret PICOPAAS_FERNET_KEY (keep a copy outside GitHub)"; exit 1; }
          echo "::add-mask::$FERNET_KEY"

          # Rotation: keep the old key (and earlier previous keys, max 3) so the platform can still decrypt and
          # re-encrypt existing rows to the new key at startup.
          OLD_FERNET_KEY=$(get FERNET_KEY); OLD_PREV=$(get FERNET_KEYS_PREVIOUS)
          for v in "$OLD_FERNET_KEY" ${OLD_PREV//,/ }; do [ -z "$v" ] || echo "::add-mask::$v"; done
          FERNET_KEYS_PREVIOUS=""; n=0
          for k in "$OLD_FERNET_KEY" ${OLD_PREV//,/ }; do
            [ -n "$k" ] && [ "$k" != "$FERNET_KEY" ] || continue
            case ",$FERNET_KEYS_PREVIOUS," in *",$k,"*) continue;; esac
            [ "$n" -lt 3 ] || break
            FERNET_KEYS_PREVIOUS="${FERNET_KEYS_PREVIOUS:+$FERNET_KEYS_PREVIOUS,}$k"; n=$((n+1))
          done
          [ -z "$FERNET_KEYS_PREVIOUS" ] || echo "FERNET_KEY changed or previous keys present: keeping $n previous key(s)"
          PLATFORM_DB_PASSWORD=$(get PLATFORM_DB_PASSWORD); [ -n "$PLATFORM_DB_PASSWORD" ] || PLATFORM_DB_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PLATFORM_DB_PASSWORD"

          # Idempotently create database `picopaas` + user `picopaas` on the managed cluster. The runner is
          # not in the DB firewall (only the k8s cluster is), so run the SQL from a throwaway in-cluster pod.
          # The admin password goes in as a pod env var and the pod is removed afterwards.
          kubectl -n default delete pod bootstrap-mysql --ignore-not-found >/dev/null
          cat <<SQL | kubectl -n default run bootstrap-mysql -i --rm --restart=Never --quiet \
              --image=mysql:8.4 --env="MYSQL_PWD=$ADMIN_PW" -- \
              mysql -h "$ADMIN_HOST" -P "$ADMIN_PORT" -u "$ADMIN_USER" --ssl-mode=REQUIRED
          CREATE DATABASE IF NOT EXISTS picopaas;
          CREATE USER IF NOT EXISTS 'picopaas'@'%' IDENTIFIED BY '$PLATFORM_DB_PASSWORD';
          ALTER USER 'picopaas'@'%' IDENTIFIED BY '$PLATFORM_DB_PASSWORD';
          GRANT ALL PRIVILEGES ON picopaas.* TO 'picopaas'@'%';
          SQL

          DATABASE_URL="mysql+pymysql://picopaas:${PLATFORM_DB_PASSWORD}@${ADMIN_HOST}:${ADMIN_PORT}/picopaas?ssl_ca=/etc/picopaas/db-ca/ca.crt"
          echo "::add-mask::$DATABASE_URL"

          kubectl -n $ns create secret generic picopaas-db-ca \
            --from-file=ca.crt="$RUNNER_TEMP/db-ca.crt" \
            ${PG_HOST:+--from-file=pg-ca.crt="$RUNNER_TEMP/pg-ca.crt"} --dry-run=client -o yaml | kubectl apply -f -

          # ---- Backups (request 0008 phase 1; enabled by Chas 2026-10-23) ----
          # Dedicated bucket in the SAME Spaces region/subscription ($0 extra) so tenant bucket listing never sees it.
          # Created idempotently with the platform Spaces key (Spaces buckets are private by default).
          BACKUP_BUCKET="picopaas-backups"
          BACKUP_ENDPOINT="https://$SPACES_REGION.digitaloceanspaces.com"
          if AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
              aws s3api head-bucket --bucket "$BACKUP_BUCKET" --endpoint-url "$BACKUP_ENDPOINT" --region "$SPACES_REGION" 2>/dev/null; then
            echo "backup bucket $BACKUP_BUCKET exists"
          else
            AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
              aws s3api create-bucket --bucket "$BACKUP_BUCKET" --endpoint-url "$BACKUP_ENDPOINT" --region "$SPACES_REGION" \
              || { echo "::error::could not create backup bucket $BACKUP_BUCKET (name taken by another account? change BACKUP_BUCKET)"; exit 1; }
          fi
          # ---- Bucket-scoped backup key (condition of the 2026-10-23 decision, docs/design/backups.md) ----
          # BACKUP_ACCESS_KEY_ID/SECRET are a DO Spaces key limited to the one bucket ($BACKUP_BUCKET, readwrite),
          # NOT the platform key. The DO API returns a key's secret only in the create response, so the secret's only
          # home is this cluster Secret. Rules:
          #   - reuse: the Secret holds an id AND a secret, that id still exists under our name, and (when the list shows
          #     grants) it is scoped to this bucket only -> keep both values untouched;
          #   - otherwise (first run, secret missing/lost, key gone, wrong grant, or rotate_backup_key) create a NEW key
          #     (random name suffix, so a name clash can never block it) and prove it works before it is stored;
          #   - superseded/orphaned keys (same name prefix, id != the one in the Secret) are revoked by the last step
          #     of this workflow, AFTER the platform rolled out with the new key, never before.
          # DIGITALOCEAN_TOKEN needs spaces_key:read, spaces_key:create_credentials and spaces_key:delete (a full-access
          # token has them; the platform already uses the same token for per-app keys). Nothing here prints a secret.
          BK_BASE="picopaas-backups-scoped"
          KD=$(mktemp -d)
          do_api() { # METHOD PATH [JSON]; response body -> $KD/do.out; prints only the HTTP status
            curl -sS -o "$KD/do.out" -w '%{http_code}' -X "$1" -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              -H 'Content-Type: application/json' ${3:+-d "$3"} "https://api.digitalocean.com$2"
          }
          list_bk_keys() { # JSON array of {access_key,name,grants} for keys named $BK_BASE or $BK_BASE-*
            local page=1 all='[]' code n
            while :; do
              code=$(do_api GET "/v2/spaces/keys?page=$page&per_page=200")
              [ "$code" = 200 ] || { echo "::error::listing Spaces keys failed (HTTP $code); DIGITALOCEAN_TOKEN needs spaces_key:read" >&2; return 1; }
              all=$(jq -c --argjson a "$all" --arg b "$BK_BASE" \
                '$a + [(.keys // [])[] | select(.name == $b or ((.name // "") | startswith($b + "-"))) | {access_key, name, grants}]' "$KD/do.out")
              n=$(jq '(.keys // []) | length' "$KD/do.out")
              [ "$n" -ge 200 ] || break
              page=$((page+1))
            done
            echo "$all"
          }
          cur_id=$(get BACKUP_ACCESS_KEY_ID); cur_sec=$(get BACKUP_SECRET_ACCESS_KEY)
          [ -z "$cur_id" ] || echo "::add-mask::$cur_id"   # public repo: key ids stay out of the logs too
          [ -z "$cur_sec" ] || echo "::add-mask::$cur_sec"
          bk_keys=$(list_bk_keys)
          reuse=no
          if [ "${ROTATE_BACKUP_KEY:-false}" != "true" ] && [ -n "$cur_id" ] && [ -n "$cur_sec" ] \
              && jq -e --arg id "$cur_id" --arg b "$BACKUP_BUCKET" '.[] | select(.access_key == $id)
                   | (.grants == null) or ((.grants | length) == 1 and .grants[0].bucket == $b and .grants[0].permission == "readwrite")' \
                   <<<"$bk_keys" >/dev/null; then
            reuse=yes
          fi
          if [ "$reuse" = yes ]; then
            BACKUP_KEY_ID="$cur_id"; BACKUP_KEY_SECRET="$cur_sec"
            echo "backup key: reusing the existing bucket-scoped key (secret already in the cluster Secret)"
          else
            if [ "${ROTATE_BACKUP_KEY:-false}" = "true" ]; then echo "backup key: rotation requested, creating a new bucket-scoped key"
            elif [ -z "$cur_sec" ] || [ -z "$cur_id" ]; then echo "backup key: no stored key/secret, creating a bucket-scoped key"
            else echo "backup key: stored key is not a valid $BK_BASE key for $BACKUP_BUCKET, creating a new one"; fi
            body=$(jq -nc --arg n "$BK_BASE-$(openssl rand -hex 3)" --arg b "$BACKUP_BUCKET" \
              '{name: $n, grants: [{bucket: $b, permission: "readwrite"}]}')
            code=$(do_api POST /v2/spaces/keys "$body")
            case "$code" in 200|201) ;; *)
              rm -rf "$KD"; echo "::error::creating the backup Spaces key failed (HTTP $code); DIGITALOCEAN_TOKEN needs spaces_key:create_credentials"; exit 1;; esac
            BACKUP_KEY_SECRET=$(jq -r '.key.secret_key // empty' "$KD/do.out")
            [ -z "$BACKUP_KEY_SECRET" ] || echo "::add-mask::$BACKUP_KEY_SECRET"
            BACKUP_KEY_ID=$(jq -r '.key.access_key // empty' "$KD/do.out")
            [ -z "$BACKUP_KEY_ID" ] || echo "::add-mask::$BACKUP_KEY_ID"
            grants_ok=$(jq -r --arg b "$BACKUP_BUCKET" '.key.grants // null | if . == null then "unknown"
              elif (length == 1 and .[0].bucket == $b and .[0].permission == "readwrite") then "yes" else "no" end' "$KD/do.out")
            rm -f "$KD/do.out"
            [ -n "$BACKUP_KEY_ID" ] && [ -n "$BACKUP_KEY_SECRET" ] || { rm -rf "$KD"; echo "::error::DO returned no key material"; exit 1; }
            [ "$grants_ok" != no ] || { rm -rf "$KD"; echo "::error::new backup key is not scoped to $BACKUP_BUCKET only; refusing to store it (the stray key will be revoked on the next run)"; exit 1; }
            # Prove the key works for what the platform does (list + restic/s5cmd/sweep need list, get, put, delete on this
            # bucket) BEFORE it replaces anything. New keys can take a few seconds to propagate.
            ok=no
            for _ in 1 2 3 4 5 6 7 8; do
              if AWS_ACCESS_KEY_ID="$BACKUP_KEY_ID" AWS_SECRET_ACCESS_KEY="$BACKUP_KEY_SECRET" \
                  aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --max-items 1 --endpoint-url "$BACKUP_ENDPOINT" --region "$SPACES_REGION" >/dev/null 2>&1; then
                ok=yes; break; fi
              sleep 5
            done
            [ "$ok" = yes ] || { rm -rf "$KD"; echo "::error::the new backup key cannot list $BACKUP_BUCKET after 40 s; the existing Secret is untouched"; exit 1; }
            echo "backup key: new key created, scoped to $BACKUP_BUCKET (readwrite) and verified"
          fi
          rm -rf "$KD"
          # Negative proof (every run, reused key included): the backup key must NOT read another bucket. Volume backups
          # put this key in tenant namespaces, so BACKUP_KEY_SCOPED=1 is set only when this check passes.
          BACKUP_KEY_SCOPED=0
          other=$(AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            aws s3api list-buckets --endpoint-url "$BACKUP_ENDPOINT" --region "$SPACES_REGION" --query 'Buckets[].Name' --output text 2>/dev/null \
            | tr '\t' '\n' | grep -vx "$BACKUP_BUCKET" | head -n1 || true)
          if [ -z "$other" ]; then
            echo "::warning::no other bucket to test the backup key against; volume backups stay off (BACKUP_KEY_SCOPED=0)"
          elif AWS_ACCESS_KEY_ID="$BACKUP_KEY_ID" AWS_SECRET_ACCESS_KEY="$BACKUP_KEY_SECRET" \
              aws s3api list-objects-v2 --bucket "$other" --max-items 1 --endpoint-url "$BACKUP_ENDPOINT" --region "$SPACES_REGION" >/dev/null 2>&1; then
            echo "::warning::the backup key can read another bucket, so it is not bucket-scoped; volume backups stay off (BACKUP_KEY_SCOPED=0)"
          else
            BACKUP_KEY_SCOPED=1
            echo "backup key: confirmed it cannot read other buckets; volume backups on (BACKUP_KEY_SCOPED=1)"
          fi
          # The backup pod must get a digest-pinned image. Use the workflow input, else resolve :latest now
          # (package ghcr.io/seaburr/picopaas-backup must be Public; build it with backup-image.yml first).
          BACKUP_IMAGE_DIGEST="${BACKUP_IMAGE_DIGEST_INPUT:-}"
          if [ -z "$BACKUP_IMAGE_DIGEST" ]; then
            BACKUP_IMAGE_DIGEST=$(docker buildx imagetools inspect ghcr.io/seaburr/picopaas-backup:latest --format '{{json .Manifest}}' | jq -r .digest)
          fi
          case "$BACKUP_IMAGE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::could not determine backup image digest (got '$BACKUP_IMAGE_DIGEST'); run backup-image.yml and make the package Public, or pass backup_image_digest"; exit 1;;
          esac
          BACKUP_IMAGE="ghcr.io/seaburr/picopaas-backup@$BACKUP_IMAGE_DIGEST"
          echo "backup image: $BACKUP_IMAGE"

          # Kaisen preview runtime image (kaisen-runtime-image.yml; package must be Public), pinned by digest like the backup
          # image. Not fatal when it does not exist yet: KAISEN_RUNTIME_IMAGE stays empty and Kaisen deploys stay disabled
          # until a later bootstrap run (after the image is published) pins it.
          KAISEN_RUNTIME_DIGEST="${KAISEN_RUNTIME_DIGEST_INPUT:-}"
          if [ -z "$KAISEN_RUNTIME_DIGEST" ]; then
            KAISEN_RUNTIME_DIGEST=$(docker buildx imagetools inspect ghcr.io/seaburr/picopaas-kaisen-runtime:latest --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest 2>/dev/null || true)
          fi
          case "$KAISEN_RUNTIME_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) KAISEN_RUNTIME_IMAGE="ghcr.io/seaburr/picopaas-kaisen-runtime@$KAISEN_RUNTIME_DIGEST";;
            *) echo "::warning::kaisen runtime image digest not found (run kaisen-runtime-image.yml, make the package Public, re-run bootstrap); KAISEN_RUNTIME_IMAGE left empty"; KAISEN_RUNTIME_IMAGE="";;
          esac
          echo "kaisen runtime image: ${KAISEN_RUNTIME_IMAGE:-<unset>}"

          # app/providers/spaces.py reads DIGITALOCEAN_TOKEN; DO_API_TOKEN is kept as an alias.
          # BACKUP_ACCESS_KEY_ID/SECRET below are the bucket-scoped key from above (picopaas-backups only), never the
          # platform SPACES_* key.
          kubectl -n $ns create secret generic picopaas-env \
            --from-literal=ENVIRONMENT=production \
            --from-literal=FERNET_KEY="$FERNET_KEY" \
            --from-literal=FERNET_KEYS_PREVIOUS="$FERNET_KEYS_PREVIOUS" \
            --from-literal=PLATFORM_DB_PASSWORD="$PLATFORM_DB_PASSWORD" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=DIGITALOCEAN_TOKEN="$DIGITALOCEAN_TOKEN" \
            --from-literal=DO_API_TOKEN="$DIGITALOCEAN_TOKEN" \
            --from-literal=SPACES_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
            --from-literal=SPACES_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            --from-literal=SPACES_REGION="$SPACES_REGION" \
            --from-literal=SPACES_ENDPOINT="https://$SPACES_REGION.digitaloceanspaces.com" \
            --from-literal=APP_DOMAIN="$DOMAIN" \
            --from-literal=BACKUPS_ENABLED=1 \
            --from-literal=BACKUP_BUCKET="$BACKUP_BUCKET" \
            --from-literal=BACKUP_PREFIX=backups/ \
            --from-literal=BACKUP_REGION="$SPACES_REGION" \
            --from-literal=BACKUP_ENDPOINT="$BACKUP_ENDPOINT" \
            --from-literal=BACKUP_IMAGE="$BACKUP_IMAGE" \
            --from-literal=KAISEN_RUNTIME_IMAGE="$KAISEN_RUNTIME_IMAGE" \
            --from-literal=BACKUP_ACCESS_KEY_ID="$BACKUP_KEY_ID" \
            --from-literal=BACKUP_SECRET_ACCESS_KEY="$BACKUP_KEY_SECRET" \
            --from-literal=BACKUP_KEY_SCOPED="$BACKUP_KEY_SCOPED" \
            --from-literal=RECONCILER_ENABLED=1 \
            --from-literal=MAX_NODES=2 \
            --from-literal=VOLUMES_ENABLED=1 \
            --from-literal=MYSQL_EGRESS_MODE=cidr \
            --from-literal=MYSQL_SSL_CA=/etc/picopaas/db-ca/ca.crt \
            --from-literal=MYSQL_EGRESS_CIDR="$VPC_CIDR" \
            --from-literal=BOOTSTRAP_DB_HOST="$ADMIN_HOST" \
            --from-literal=BOOTSTRAP_DB_PORT="$ADMIN_PORT" \
            --from-literal=BOOTSTRAP_DB_USER="$ADMIN_USER" \
            --from-literal=BOOTSTRAP_DB_PASSWORD="$ADMIN_PW" \
            --from-literal=PG_EGRESS_CIDR="$VPC_CIDR" \
            --from-literal=BOOTSTRAP_PG_HOST="${PG_HOST:-}" \
            --from-literal=BOOTSTRAP_PG_PORT="${PG_PORT:-25060}" \
            --from-literal=BOOTSTRAP_PG_USER="${PG_USER:-}" \
            --from-literal=BOOTSTRAP_PG_PASSWORD="${PG_PW:-}" \
            --from-literal=BOOTSTRAP_PG_CA=/etc/picopaas/db-ca/pg-ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---- step 5: issuers, certificate, platform workload ----
      - name: Apply issuers and wildcard certificate
        if: steps.gate.outputs.run == 'true'
        run: |
          kubectl apply -f deploy/cert-manager/clusterissuer.yaml
          kubectl apply -f deploy/cert-manager/certificate.yaml

      - name: Deploy platform
        if: steps.gate.outputs.run == 'true'
        run: |
          envsum=$(kubectl -n picopaas-system get secret picopaas-env -o json | jq -S -c .data | sha256sum | cut -d' ' -f1)
          sed -e "s#image: ghcr.io/seaburr/picopaas:.*#image: $IMAGE#" \
              -e "s#picopaas.io/env-checksum: .*#picopaas.io/env-checksum: \"$envsum\"#" \
              deploy/platform/deployment.yaml | kubectl apply -f -
          # Static 503 pages + Traefik errors Middlewares. MUST precede ingress.yaml: an Ingress that references a
          # missing Middleware loses its router (404), not just the error page.
          kubectl -n picopaas-system create configmap error-pages \
            --from-file=platform.html=deploy/error-pages/platform.html --from-file=app.html=deploy/error-pages/app.html \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/error-pages/error-pages.yaml
          kubectl apply -f deploy/platform/service.yaml -f deploy/platform/ingress.yaml
          kubectl -n picopaas-system rollout status deployment/picopaas --timeout=300s

      # Revoke backup keys superseded by a rotation / re-create, orphans from an interrupted run included. Runs only after
      # the platform rolled out with the key now stored in picopaas-env, and refuses to delete anything unless that key is
      # itself found among our keys.
      - name: Revoke superseded backup Spaces keys
        if: steps.gate.outputs.run == 'true'
        run: |
          set -uo pipefail
          BK_BASE="picopaas-backups-scoped"
          cur=$(kubectl -n picopaas-system get secret picopaas-env -o jsonpath='{.data.BACKUP_ACCESS_KEY_ID}' | base64 -d || true)
          [ -n "$cur" ] || { echo "::notice::no BACKUP_ACCESS_KEY_ID in picopaas-env; nothing to revoke"; exit 0; }
          KD=$(mktemp -d)
          ids=""; page=1
          while :; do
            code=$(curl -sS -o "$KD/o" -w '%{http_code}' -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/spaces/keys?page=$page&per_page=200")
            [ "$code" = 200 ] || { echo "::warning::could not list Spaces keys (HTTP $code); old backup keys not revoked"; exit 0; }
            ids="$ids $(jq -r --arg b "$BK_BASE" '(.keys // [])[] | select(.name == $b or ((.name // "") | startswith($b + "-"))) | .access_key' "$KD/o")"
            [ "$(jq '(.keys // []) | length' "$KD/o")" -ge 200 ] || break
            page=$((page+1))
          done
          rm -rf "$KD"
          # shellcheck disable=SC2086,SC2116 # intentional: unquoted echo splits and re-joins $ids with single spaces
          case " $(echo $ids) " in *" $cur "*) ;; *) echo "::warning::the stored backup key was not found among Spaces keys; revoking nothing"; exit 0;; esac
          for id in $ids; do
            echo "::add-mask::$id"
            [ "$id" != "$cur" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/spaces/keys/$id")
            # Public repo, public logs: never print key ids.
            case "$code" in 204|200|404) echo "revoked one superseded backup key";; *) echo "::warning::could not revoke a superseded backup key (HTTP $code)";; esac
          done

      - name: Health check (waits for the certificate, up to ~10 min)
        if: steps.gate.outputs.run == 'true'
        run: |
          url="https://$PLATFORM_HOST/healthz"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$url" >/dev/null 2>&1; then
              echo "healthz OK with a valid certificate"; exit 0
            fi
            echo "not healthy yet ($i/40)"; sleep 15
          done
          echo "::warning::strict TLS check failed after ~10 min; certificate probably not issued yet (kubectl describe certificate -n traefik)"
          kubectl -n traefik get certificate || true
          if curl -fsSk --max-time 10 --resolve "$PLATFORM_HOST:443:$LB_IP" "$url" >/dev/null; then
            echo "::warning::app is up via $LB_IP but the certificate is not ready (insecure check passed). Re-run later."
          else
            echo "::error::healthz failed even with -k"; exit 1
          fi
