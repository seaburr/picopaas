name: crs-sync

# Weekly: when OWASP CRS has a new release, regenerate the edge block on sensitive paths on a branch and open an issue
# with what changed. A person reviews it and opens the PR: Actions can't open PRs in this repo, and a push made with
# GITHUB_TOKEN doesn't start CI, so this job runs the path tests itself. A human-opened PR then runs the full CI.
on:
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Compare with the latest CRS release
        id: crs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/coreruleset/coreruleset/releases/latest --jq .tag_name)
          pinned=$(sed -n 's/^crsVersion: //p' scripts/sensitive_paths/rules.yaml)
          branch="crs-sync/$latest"
          if ! printf '%s' "$latest" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected tag name, skipping" >&2
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$pinned" ] || git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crs.outputs.new == 'true'
        run: pip install -r requirements.txt
      - name: Regenerate and test
        if: steps.crs.outputs.new == 'true'
        env:
          LATEST: ${{ steps.crs.outputs.latest }}
        run: |
          cp scripts/sensitive_paths/crs-restricted-files.data /tmp/crs-old.data
          python scripts/sensitive_paths/build.py --update "$LATEST"
          python -m pytest tests/test_sensitive_paths.py -q
      - name: Push the branch and open an issue
        if: steps.crs.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.crs.outputs.latest }}
          PINNED: ${{ steps.crs.outputs.pinned }}
          BRANCH: ${{ steps.crs.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add scripts/sensitive_paths deploy/error-pages/sensitive-paths.yaml
          git commit -m "chore(edge): sync sensitive paths with OWASP CRS $LATEST"
          git push origin "$BRANCH"
          {
            echo "OWASP CRS $LATEST is out (we use $PINNED). The path tests passed on \`$BRANCH\`."
            echo
            echo "Check that nothing added is a path real apps serve; add such names to \`skip\` in \`scripts/sensitive_paths/rules.yaml\`."
            echo
            echo '```diff'
            diff <(grep -v '^#' /tmp/crs-old.data | sort -u) <(grep -v '^#' scripts/sensitive_paths/crs-restricted-files.data | sort -u) | grep '^[<>]' | sed 's/^</-/;s/^>/+/' | tr -cd '[:print:]\n' | tr -d '`@<>[]' | head -200 || true
            echo '```'
            echo
            echo "[Open the PR](https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1). The full CI runs on it, and the rule ships when it merges."
          } > /tmp/body.md
          gh issue create --title "Sensitive paths: OWASP CRS $LATEST available" --body-file /tmp/body.md
