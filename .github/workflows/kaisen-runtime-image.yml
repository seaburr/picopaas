name: kaisen-runtime-image

# Builds the Kaisen runtime image (images/kaisen-runtime) to GHCR. Kaisen previews are ordinary apps running this image;
# it downloads the build's bundle at boot. The platform pins it as KAISEN_RUNTIME_IMAGE (docs/OPERATIONS.md "Kaisen runtime image").
# The package must be PUBLIC so the cluster can pull it anonymously (one-time: GitHub > Packages >
# picopaas-kaisen-runtime > Package settings > Change visibility > Public).
on:
  push:
    branches: [main]
    paths:
      - "images/kaisen-runtime/**"
      - ".github/workflows/kaisen-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kaisen-runtime
          platforms: linux/amd64
          load: true
          pull: true
          tags: picopaas-kaisen-runtime:smoke
          cache-from: type=gha

      # boot.py downloads a tiny static bundle served from the runner, verifies its sha256 and serves it; expect HTTP 200.
      - name: Smoke test (static bundle)
        run: images/kaisen-runtime/ci-smoke.sh picopaas-kaisen-runtime:smoke

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kaisen-runtime
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/seaburr/picopaas-kaisen-runtime:latest
            ghcr.io/seaburr/picopaas-kaisen-runtime:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
