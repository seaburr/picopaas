name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (short or full) whose image to roll out; default = current ref"
        required: false
  # Runs after the image build AND after CI; the "green CI" step below makes only the later of the two deploy, and only
  # when both passed for the same commit. A manual workflow_dispatch skips that check (an explicit override).
  workflow_run:
    workflows: [image, CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, only deploy when the image build succeeded AND came from a push to THIS repo (not a fork
    # branch that happens to be named main), since this job has secrets in scope.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - name: Skip if no DigitalOcean token or cluster yet
        id: gate
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ]; then
            echo "::notice::DIGITALOCEAN_TOKEN is not set; skipping deploy (infra not provisioned yet)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" "https://api.digitalocean.com/v2/kubernetes/clusters" \
              | jq -e '.kubernetes_clusters[] | select(.name == "picopaas-nyc3")' >/dev/null; then
            echo "::notice::cluster picopaas-nyc3 doesn't exist yet; skipping deploy (run the terraform workflow first)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require green CI and image for this commit
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_run'
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          state() {  # conclusion of the newest push run of workflow $1 for this commit ("" while it is still running)
            gh api "repos/${{ github.repository }}/actions/workflows/$1/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then "" else .conclusion end'
          }
          # Only main's tip deploys: an older commit whose CI finishes late must not roll prod back (the tip's own
          # runs deploy it). Note the run list shows main's tip as every workflow_run deploy's head_sha; SHA here is
          # the commit that triggered this run.
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::not deploying ${SHA:0:7}: main is now at ${tip:0:7}, whose own runs will deploy it"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(state ci.yml); img=$(state image.yml)
          echo "CI: ${ci:-running}, image: ${img:-running}"
          if [ "$ci" = "success" ] && [ "$img" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$ci" ] || [ -z "$img" ]; then
            echo "::notice::waiting for the other workflow; its completion triggers the deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::not deploying ${SHA:0:7}: CI=$ci image=$img"
            exit 1
          fi

      - name: Work out image tag
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'
        id: tag
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CUR_SHA: ${{ github.sha }}
        run: |
          full="${INPUT_SHA:-${RUN_SHA:-$CUR_SHA}}"
          if ! echo "$full" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::sha must be 7-40 hex chars"; exit 1
          fi
          echo "short=$(echo "$full" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'

      - name: Save kubeconfig
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'
        run: doctl kubernetes cluster kubeconfig save picopaas-nyc3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'

      # Apply the platform manifests too (not just the image), so changes like replicas/RBAC ship with every deploy.
      - name: Roll out image + platform manifests
        if: steps.gate.outputs.run == 'true' && steps.green.outputs.ok != 'false'
        env:
          IMAGE: ghcr.io/seaburr/picopaas:${{ steps.tag.outputs.short }}
        run: |
          kubectl apply -f deploy/platform/rbac.yaml
          # PriorityClass must exist before the Deployment that references it (else admission rejects the pod).
          kubectl apply -f deploy/platform/priorityclass.yaml
          # Backups (off by default): the picopaas-backup namespace/RBAC/NetworkPolicy exist only once BACKUPS_ENABLED=1.
          if [ "$(kubectl -n picopaas-system get secret picopaas-env -o jsonpath='{.data.BACKUPS_ENABLED}' 2>/dev/null | base64 -d)" = "1" ]; then
            dbcidr=$(kubectl -n picopaas-system get secret picopaas-env -o jsonpath='{.data.MYSQL_EGRESS_CIDR}' | base64 -d)
            pgcidr=$(kubectl -n picopaas-system get secret picopaas-env -o jsonpath='{.data.PG_EGRESS_CIDR}' 2>/dev/null | base64 -d)
            [ -n "$dbcidr" ] || { echo "BACKUPS_ENABLED=1 needs MYSQL_EGRESS_CIDR in picopaas-env"; exit 1; }
            sed -e "s#__DB_EGRESS_CIDR__#$dbcidr#" -e "s#__PG_EGRESS_CIDR__#${pgcidr:-$dbcidr}#" \
                deploy/platform/backup.yaml | kubectl apply -f -
          fi
          envsum=$(kubectl -n picopaas-system get secret picopaas-env -o json | jq -S -c .data | sha256sum | cut -d' ' -f1)
          sed -e "s#image: ghcr.io/seaburr/picopaas:.*#image: $IMAGE#" \
              -e "s#picopaas.io/env-checksum: .*#picopaas.io/env-checksum: \"$envsum\"#" \
              deploy/platform/deployment.yaml | kubectl apply -f -
          # Kaisen worker: same image + env, own pod (no kube permissions). Egress policy needs the DB CIDR from the Secret.
          dbcidr=$(kubectl -n picopaas-system get secret picopaas-env -o jsonpath='{.data.MYSQL_EGRESS_CIDR}' | base64 -d)
          [ -n "$dbcidr" ] || { echo "kaisen-worker needs MYSQL_EGRESS_CIDR in picopaas-env"; exit 1; }
          sed -e "s#image: ghcr.io/seaburr/picopaas:.*#image: $IMAGE#" \
              -e "s#picopaas.io/env-checksum: .*#picopaas.io/env-checksum: \"$envsum\"#" \
              -e "s#__DB_EGRESS_CIDR__#$dbcidr#" \
              deploy/platform/kaisen-worker.yaml | kubectl apply -f -
          # Static 503 pages + Traefik errors Middlewares. MUST precede ingress.yaml: an Ingress that references a
          # missing Middleware loses its router (404), not just the error page.
          kubectl -n picopaas-system create configmap error-pages \
            --from-file=platform.html=deploy/error-pages/platform.html --from-file=app.html=deploy/error-pages/app.html \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/error-pages/error-pages.yaml
          kubectl apply -f deploy/platform/service.yaml -f deploy/platform/ingress.yaml
          kubectl -n picopaas-system rollout status deployment/picopaas --timeout=300s
          kubectl -n picopaas-system rollout status deployment/kaisen-worker --timeout=300s
