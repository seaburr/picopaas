name: probe
on:
  push:
    branches: ["fix/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ADMIN_PASSWORD: ci-admin-password-0123456789abcdef
          MYSQL_BACKUP_PASSWORD: ci-backup-password-0123456789abcdef
        run: |
          ruby -ryaml -e 'YAML.load_stream(File.read("deploy/mysql/statefulset.yaml")).each { |d| puts d["data"]["10-users.sh"] if d && d["kind"] == "ConfigMap" && d["metadata"]["name"] == "mysql-initdb" }' > /tmp/10-users.sh
          bash /tmp/10-users.sh
          R="mysql -h127.0.0.1 -uroot -ptest"
          A="mysql -h127.0.0.1 -upicopaas_admin -p$MYSQL_ADMIN_PASSWORD"
          $R -e "SHOW GRANTS FOR 'picopaas_admin'@'%'; SELECT VERSION();"
          $A -e "CREATE DATABASE app_77; CREATE USER 'app_77'@'%' IDENTIFIED BY 'x1234567890abcdefXYZ' WITH MAX_USER_CONNECTIONS 5;" || true
          echo "--- ALL"; $A -e "GRANT ALL ON app_77.* TO 'app_77'@'%'" || true
          for p in "SELECT" "INSERT,UPDATE,DELETE" "CREATE,DROP,ALTER,INDEX" "REFERENCES" "CREATE TEMPORARY TABLES" "LOCK TABLES" "EXECUTE" "CREATE VIEW,SHOW VIEW" "CREATE ROUTINE,ALTER ROUTINE" "EVENT" "TRIGGER"; do
            echo "--- $p"; $A -e "GRANT $p ON app_77.* TO 'app_77'@'%'" 2>&1 || true
          done
          echo "--- escaped"; $A -e 'GRANT ALL ON `app_77`.* TO "app_77"@"%"' 2>&1 || true
          $R -e "SHOW GRANTS FOR 'app_77'@'%'"
