name: terraform

# Manual, plan-only. There is deliberately NO apply here: applies need an APPROVED docs/requests entry
# and are run by hand (or from Terraform Cloud) by a human.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Skip if no Terraform Cloud token
        id: gate
        run: |
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo "::notice::TF_API_TOKEN is not set; skipping terraform plan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.run == 'true'
        with:
          terraform_wrapper: false
      # Fail early if the MySQL size slug isn't orderable for mysql in the region (DO has no docs table for these).
      - name: Check managed MySQL size slug
        if: steps.gate.outputs.run == 'true' && env.DIGITALOCEAN_TOKEN != ''
        run: |
          slug=$(sed -n '/variable "mysql_size"/,/^}/s/.*default *= *"\(.*\)"/\1/p' variables.tf)
          region=$(sed -n '/variable "region"/,/^}/s/.*default *= *"\(.*\)"/\1/p' variables.tf)
          opts=$(curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" https://api.digitalocean.com/v2/databases/options)
          echo "$opts" | jq -e --arg r "$region" '.options.mysql.regions | index($r)' >/dev/null \
            || { echo "::error::managed MySQL not offered in $region"; exit 1; }
          echo "$opts" | jq -e --arg s "$slug" '[.options.mysql.layouts[].sizes[]] | index($s)' >/dev/null \
            || { echo "::error::slug $slug not valid; mysql sizes:"; echo "$opts" | jq -c '[.options.mysql.layouts[].sizes[]]|unique'; exit 1; }
          echo "mysql slug $slug OK in $region"
      # Provider creds (DIGITALOCEAN_TOKEN, Spaces keys) are workspace env vars in Terraform Cloud.
      - run: terraform init -input=false
        if: steps.gate.outputs.run == 'true'
      - run: terraform plan -input=false
        if: steps.gate.outputs.run == 'true'
