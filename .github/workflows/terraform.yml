name: terraform

# Manual plan + apply (Chas, 2026-10-19). Run it only for changes covered by an APPROVED docs/requests entry.
# Untick "apply" to get a plan only. Runs on the GitHub runner; Terraform Cloud (seaburr/picopaas) stores state only.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after planning (unticked = plan only)"
        type: boolean
        default: true

concurrency: terraform

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Skip if no Terraform Cloud token
        id: gate
        working-directory: .  # runs before checkout, so infra/ doesn't exist yet
        run: |
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo "::notice::TF_API_TOKEN is not set; skipping terraform plan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.run == 'true'
        with:
          terraform_wrapper: false
      # Fail early if the MySQL size slug isn't orderable for mysql in the region (DO has no docs table for these).
      - name: Check managed MySQL size slug
        if: steps.gate.outputs.run == 'true' && env.DIGITALOCEAN_TOKEN != ''
        run: |
          slug=$(sed -n '/variable "mysql_size"/,/^}/s/.*default *= *"\(.*\)"/\1/p' variables.tf)
          region=$(sed -n '/variable "region"/,/^}/s/.*default *= *"\(.*\)"/\1/p' variables.tf)
          opts=$(curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" https://api.digitalocean.com/v2/databases/options)
          echo "$opts" | jq -e --arg r "$region" '.options.mysql.regions | index($r)' >/dev/null \
            || { echo "::error::managed MySQL not offered in $region"; exit 1; }
          echo "$opts" | jq -e --arg s "$slug" '[.options.mysql.layouts[].sizes[]] | index($s)' >/dev/null \
            || { echo "::error::slug $slug not valid; mysql sizes:"; echo "$opts" | jq -c '[.options.mysql.layouts[].sizes[]]|unique'; exit 1; }
          echo "mysql slug $slug OK in $region"
          echo "mysql versions: $(echo "$opts" | jq -c '.options.mysql.versions')"
          echo "doks sizes: $(curl -fsS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" https://api.digitalocean.com/v2/kubernetes/options \
            | jq -c '[.options.sizes[].slug | select(test("^s-2vcpu-4gb|^s-4vcpu-8gb|^c-2|^g-2"))]')"
      # TFC holds state only: "local" execution runs Terraform here, so the provider reads the GitHub secrets above
      # (no credentials stored in TFC). Idempotent.
      - name: Set TFC workspace to local execution
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsS -X PATCH https://app.terraform.io/api/v2/organizations/seaburr/workspaces/picopaas \
            -H "Authorization: Bearer $TF_TOKEN_app_terraform_io" -H "Content-Type: application/vnd.api+json" \
            -d '{"data":{"type":"workspaces","attributes":{"execution-mode":"local"}}}' >/dev/null
      - run: terraform init -input=false
        if: steps.gate.outputs.run == 'true'
      - run: terraform plan -input=false
        if: steps.gate.outputs.run == 'true'
      - name: terraform apply
        if: steps.gate.outputs.run == 'true' && inputs.apply
        run: terraform apply -input=false -auto-approve
