name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (no backend; no credentials needed)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: kubeconform
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            -ignore-filename-pattern 'values\.ya?ml$' deploy/

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # MYSQL_ADMIN_URL is unset here, so tests/test_mysql_admin.py
      # (@pytest.mark.mysql) self-skips at module level — see mysql-integration below.
      - run: python -m pytest tests/ -q

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_ADMIN_URL: mysql://root:test@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -m mysql -q
      # Prove deploy/mysql's initdb script works and that picopaas_admin's narrowed
      # privileges are enough for MySQLAdminClient (issue #1).
      - name: Apply deploy/mysql initdb users
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ADMIN_PASSWORD: ci-admin-password-0123456789abcdef
          MYSQL_BACKUP_PASSWORD: ci-backup-password-0123456789abcdef
        run: |
          ruby -ryaml -e 'YAML.load_stream(File.read("deploy/mysql/statefulset.yaml")).each { |d| puts d["data"]["10-users.sh"] if d && d["kind"] == "ConfigMap" && d["metadata"]["name"] == "mysql-initdb" }' > /tmp/10-users.sh
          test -s /tmp/10-users.sh
          bash /tmp/10-users.sh
          mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW GRANTS FOR 'picopaas_admin'@'%';"
          # The admin must be able to create app_* schemas and nothing else.
          mysql -upicopaas_admin -p"$MYSQL_ADMIN_PASSWORD" -e "CREATE DATABASE app_ci_probe; DROP DATABASE app_ci_probe;"
          ! mysql -upicopaas_admin -p"$MYSQL_ADMIN_PASSWORD" -e "CREATE DATABASE notapp_probe;" 2>/dev/null
          ! mysql -upicopaas_admin -p"$MYSQL_ADMIN_PASSWORD" -e "SELECT * FROM mysql.user LIMIT 1;" 2>/dev/null
      - name: MySQL tests as picopaas_admin
        env:
          MYSQL_ADMIN_URL: mysql://picopaas_admin:ci-admin-password-0123456789abcdef@127.0.0.1:3306
        run: python -m pytest tests/ -m mysql -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
