name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: no secret-scan allowlists
        run: |
          if [ -e .gitleaksignore ] || [ -e .gitleaks.toml ]; then
            echo "::error::gitleaks allowlists are banned (CLAUDE.md). Change the flagged value instead."; exit 1
          fi
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (no backend; no credentials needed)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: kubeconform
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            -ignore-filename-pattern 'values\.ya?ml$' deploy/

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # MYSQL_ADMIN_URL is unset here, so tests/test_mysql_admin.py
      # (@pytest.mark.mysql) self-skips at module level — see mysql-integration below.
      # Coverage floor (fail_under in .coveragerc) is enforced here only.
      - run: python -m pytest tests/ -q --cov=app --cov-report=term-missing:skip-covered

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_ADMIN_URL: mysql://root:test@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -m mysql -q
      # Prove deploy/mysql's initdb script works and that picopaas_admin's narrowed
      # privileges are enough for MySQLAdminClient (issue #1).
      - name: Apply deploy/mysql initdb users
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ADMIN_PASSWORD: ci-admin-password-0123456789abcdef
          MYSQL_BACKUP_PASSWORD: ci-backup-password-0123456789abcdef
        run: |
          ruby -ryaml -e 'YAML.load_stream(File.read("deploy/mysql/statefulset.yaml")).each { |d| puts d["data"]["10-users.sh"] if d && d["kind"] == "ConfigMap" && d["metadata"]["name"] == "mysql-initdb" }' > /tmp/10-users.sh
          test -s /tmp/10-users.sh
          bash /tmp/10-users.sh
          mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW GRANTS FOR 'picopaas_admin'@'%';"
          A="mysql -upicopaas_admin -p$MYSQL_ADMIN_PASSWORD"
          # The admin holds only EXECUTE on picopaas_ops: it can provision app_* via procedures...
          $A -e "CALL picopaas_ops.provision_app(99001, 'ci-probe-password-0123456789'); CALL picopaas_ops.drop_app(99001);"
          # ...and nothing else.
          ! $A -e "CREATE DATABASE app_ci_probe;" 2>/dev/null
          ! $A -e "CREATE DATABASE notapp_probe;" 2>/dev/null
          ! $A -e "SELECT * FROM mysql.user LIMIT 1;" 2>/dev/null
          ! $A -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'pwned-pwned-pwned';" 2>/dev/null
          ! $A -e "ALTER USER 'root'@'%' IDENTIFIED BY 'pwned-pwned-pwned';" 2>/dev/null
          ! $A -e "ALTER USER 'picopaas_backup'@'%' IDENTIFIED BY 'pwned-pwned-pwned';" 2>/dev/null
          ! $A -e "DROP USER 'picopaas_backup'@'%';" 2>/dev/null
          ! $A -e "DROP DATABASE picopaas_ops;" 2>/dev/null
          ! $A -e "CALL picopaas_ops._exec('SELECT 1');" 2>/dev/null
          # Procedures reject anything that is not a plain positive integer id.
          ! $A -e "CALL picopaas_ops.provision_app(0, 'ci-probe-password-0123456789');" 2>/dev/null
          ! $A -e "CALL picopaas_ops.drop_app(-1);" 2>/dev/null
          ! $A -e "CALL picopaas_ops.drop_app('1; DROP USER root');" 2>/dev/null
          # Root and backup still work (admin changes above did not take effect).
          mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null
          mysql -upicopaas_backup -p"$MYSQL_BACKUP_PASSWORD" -e "SELECT 1" >/dev/null
      - name: MySQL tests as picopaas_admin
        env:
          MYSQL_ADMIN_URL: mysql://picopaas_admin:ci-admin-password-0123456789abcdef@127.0.0.1:3306
          MYSQL_TEST_ROOT_URL: mysql://root:test@127.0.0.1:3306
          MYSQL_ADMIN_USE_PROCEDURES: "1"
        run: python -m pytest tests/ -m mysql -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:layout
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
