name: examples

# Builds the example apps (e.g. the Ghost CMS demo) to GHCR. Separate from testapps so the demo images
# aren't pulled into the e2e matrix.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:
  # Weekly rebuild so base-image security patches (php/alpine/nginx) are picked up without a code change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [status, wordpress]
        include:
          # Ghost 5 was retired after both blogs moved to Ghost 6. Dir examples/ghost publishes as ...-ghost6.
          - app: ghost
            image: ghost6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.19.2
        with:
          context: examples/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            WITH_S3=1
          tags: |
            ghcr.io/seaburr/picopaas-example-${{ matrix.image || matrix.app }}:latest
            ghcr.io/seaburr/picopaas-example-${{ matrix.image || matrix.app }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
