name: examples

# Builds the example apps (e.g. the Ghost CMS demo) to GHCR. Separate from testapps so the demo images
# aren't pulled into the e2e matrix.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:
  # Weekly rebuild so base-image security patches (php/alpine/nginx) are picked up without a code change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [status, wordpress]
        include:
          # Ghost is built twice during the 5 -> 6 migration (docs: examples/ghost/README.md "Upgrading to Ghost 6").
          # The live blogs track :latest, which stays on Ghost 5 until every blog has been cut over.
          # Ghost 6 ships as :6 / :6-<sha>. At cutover, move :latest to the 6 build (see README), then drop the g5 row.
          - app: ghost
            ghost_major: "5"
            tag_main: latest
            tag_sha_prefix: ""
          - app: ghost
            ghost_major: "6"
            tag_main: "6"
            tag_sha_prefix: "6-"
          - app: status
            tag_main: latest
            tag_sha_prefix: ""
          - app: wordpress
            tag_main: latest
            tag_sha_prefix: ""
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.4.0

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.19.2
        with:
          context: examples/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            WITH_S3=1
            GHOST_MAJOR=${{ matrix.ghost_major || '6' }}
          tags: |
            ghcr.io/seaburr/picopaas-example-${{ matrix.app }}:${{ matrix.tag_main }}
            ghcr.io/seaburr/picopaas-example-${{ matrix.app }}:${{ matrix.tag_sha_prefix }}${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ matrix.app }}${{ matrix.ghost_major }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}${{ matrix.ghost_major }}
