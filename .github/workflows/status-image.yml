name: status-image

# Builds the PicoPaaS status-page image (Gatus + our baked config) and pushes it to GHCR.
# The platform pulls this image anonymously, so the ghcr.io/seaburr/picopaas-status package
# must be set to Public once (GitHub > seaburr > Packages > picopaas-status > visibility).
on:
  push:
    branches: [main]
    paths:
      - deploy/status/**
      - .github/workflows/status-image.yml
  pull_request:
    paths:
      - deploy/status/**
      - .github/workflows/status-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build (PR: validate only, no push)"
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/status
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/status
          push: true
          tags: |
            ghcr.io/seaburr/picopaas-status:5.37.0
            ghcr.io/seaburr/picopaas-status:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
