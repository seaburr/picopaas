name: backup-image

# Builds the backup image (restic + DB clients, images/backup) to GHCR for the platform's backup Jobs.
# The package must be PUBLIC so the cluster can pull it anonymously (one-time: GitHub > Packages >
# picopaas-backup > Package settings > Change visibility > Public).
on:
  push:
    branches: [main]
    paths:
      - "images/backup/**"
      - ".github/workflows/backup-image.yml"
  workflow_dispatch:
  # Weekly rebuild so Alpine security patches are picked up without a code change.
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/backup
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: picopaas-backup:smoke
          cache-from: type=gha

      # The script's pytest tests stub the DB clients and restic; this runs the built image against real MySQL 8.4 and
      # PostgreSQL 17 (backup + restore) so a client flag the packaged tools reject fails the build, not production.
      - name: Smoke test against real databases
        run: images/backup/tests/smoke.sh picopaas-backup:smoke

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/backup
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/seaburr/picopaas-backup:latest
            ghcr.io/seaburr/picopaas-backup:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
