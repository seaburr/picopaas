[pytest]
markers =
    mysql: integration tests against a real MySQL server (needs MYSQL_ADMIN_URL); skipped otherwise.
    e2e: live-environment tests against a deployed PicoPaaS (needs PICOPAAS_URL tokens); skipped unless E2E_USER_TOKEN and E2E_ADMIN_TOKEN are set.
    pentest: live tenant-isolation tests (docs/PENTEST.md); same env as e2e.
